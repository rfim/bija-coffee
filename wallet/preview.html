<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Bija Card wallet pass preview</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2f2f0; color: #0b0b0b; font: 15px/1.5 Inter, system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 32px 16px; }
  main { width: 100%; max-width: 760px; }
  h1 { font: 900 clamp(28px, 6vw, 44px)/1 Archivo, 'Arial Black', sans-serif; text-transform: uppercase; margin: 0 0 8px; }
  p.note { color: #555; margin: 0 0 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .pass { width: 320px; max-width: 100%; border-radius: 14px; overflow: hidden; background: #0b0b0b; color: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
  .pass header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; }
  .pass header img { height: 30px; width: auto; }
  .lab { font-size: 10px; letter-spacing: .08em; color: #a3a3a3; text-transform: uppercase; }
  .val { font-size: 16px; }
  .strip { position: relative; }
  .strip img { width: 100%; display: block; }
  .strip .pts { position: absolute; left: 14px; bottom: 10px; }
  .strip .pts .val { font-size: 34px; font-weight: 300; line-height: 1; }
  .sec { display: flex; justify-content: space-between; padding: 12px 14px; }
  .code { background: #fff; margin: 6px auto 16px; width: 150px; padding: 10px; border-radius: 8px; text-align: center; color: #0b0b0b; font: 600 12px ui-monospace, Menlo, monospace; }
  .code svg { width: 130px; height: 130px; display: block; }
  .badges { display: grid; gap: 12px; }
  .badges button { background: none; border: 0; padding: 0; cursor: pointer; min-height: 52px; }
  .badges button:focus-visible { outline: 3px solid #0b0b0b; outline-offset: 3px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>Bija Card pass</h1>
  <p class="note">A mock of how the Bija Card looks in Apple Wallet (black and white, Kawung strip, QR with the member code) and the "Add to" buttons. Sample data only. Real passes need the owner's Apple and Google wallet accounts.</p>
  <div class="row">
    <div class="pass" aria-label="Sample Bija Card pass">
      <header><img src="logo@2x.png" alt="Bija" width="96" height="30"><div><div class="lab">Tier</div><div class="val">Seed</div></div></header>
      <div class="strip"><img src="strip@2x.png" alt="" width="375" height="123"><div class="pts"><div class="lab">Points</div><div class="val">865</div></div></div>
      <div class="sec"><div><div class="lab">Stamps</div><div class="val">4 of 10</div></div><div style="text-align:right"><div class="lab">Member</div><div class="val">BIJA-7KQ2M</div></div></div>
      <div class="code" id="qr">BIJA-7KQ2M</div>
    </div>
    <div class="badges" id="badges"></div>
  </div>
</main>
<script src="../qr.js"></script>
<script src="../wallet.js"></script>
<script>
  document.getElementById('badges').innerHTML = ['apple', 'google'].map((k) => `<button type="button" aria-label="${k === 'apple' ? 'Add to Apple Wallet' : 'Add to Google Wallet'} (preview only)">${BijaWallet.badge(k)}</button>`).join('');
  try { const q = qrcode(0, 'M'); q.addData('BIJA-7KQ2M'); q.make(); document.getElementById('qr').insertAdjacentHTML('afterbegin', q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })); } catch {}
</script>
</body>
</html>
