<style>
/* Bija brand: black page, white Helvetica-style type, four-circle mark (matches bijacoffee.co.uk).

:root {
  --paper: #000000; --card: #121212; --ink: #f2f2f2; --muted: #a3a3a3; --line: rgba(255, 255, 255, .16); --accent: #ffffff; --accent-ink: #000000; --gold: #d9b46a; --leaf: #8fbf7f; --warn: #f0a35a; color-scheme: dark;

}
@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] { --paper: #000000; --card: #121212; --ink: #f2f2f2; --muted: #a3a3a3; --line: rgba(255, 255, 255, .16); --accent: #ffffff; --accent-ink: #000000; --gold: #d9b46a; --leaf: #8fbf7f; --warn: #f0a35a; color-scheme: dark; }
* { box-sizing: border-box; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(220px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

  // ----- gift cards -----
  const giftCode = () => { const a = 'ACDEFGHJKMNPQRTUVWXY34679'; const r = (n) => Array.from({ length: n }, () => a[Math.floor(Math.random() * a.length)]).join(''); return `BIJA-${r(4)}-${r(4)}`; };
  function giftData() {
    const gifts = [], credited = new Map();
    for (const [cid, bd] of Object.entries(S.bars)) for (const [code, x] of Object.entries(bd?.credits || {})) credited.set(code, { ...x, to: cid });
    for (const c of S.customers) for (const [gid, g] of Object.entries(c.gifts || {})) gifts.push({ ...g, gid, buyer: c.id, bname: c.name || 'Guest', paid: S.bars[c.id]?.giftsPaid?.[gid], used: credited.get(g.code) });
    const claims = [];
    for (const c of S.customers) for (const [code, cl] of Object.entries(c.claims || {})) if (!S.bars[c.id]?.credits?.[code] && !cl.rejected) claims.push({ code, cid: c.id, cname: c.name || 'Guest', at: cl.at, gift: gifts.find((g) => g.code === code) });
    return { gifts, claims, credited };
  }

        : `<circle r="5" fill="#fff" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="2 2"/>`;

  function secretPage() {

          <label class="f">Anything to tell the bar? <span class="h">Optional</span><input type="text" id="rc-${esc(o.id)}" data-rc="${esc(o.id)}" value="${esc(d.comment)}" maxlength="200"></label>

  // ===== barista =====
  function barista() {
    if (!S.custLoaded || !S.configLoaded) return notReady();
    if (S.btab === 'members') return members();
    if (S.btab === 'shop') return shopBar();
    if (S.btab === 'gifts') return giftsBar();
    if (S.btab === 'insights') return insights();
    if (S.btab === 'menu') return menuEditor();
    if (S.btab === 'finance') return finance();
    return queue();
  }
  function allOrders() {
    const out = [];
    for (const c of S.customers) { const b = S.bars[c.id]; for (const o of ordersOf(c, b)) out.push({ ...o, cid: c.id, cname: c.name || 'Guest', st: () => stats(c, b) }); }
    return out.sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));
  }
  function queue() {
    const all = allOrders();
    const active = all.filter((o) => o.status !== 'collected' && o.status !== 'cancelled').reverse();
    const today = new Date().toDateString();
    const todays = all.filter((o) => o.status !== 'cancelled' && new Date(o.createdAt).toDateString() === today);
    const list = S.qFilter === 'active' ? active : S.qFilter === 'collected' ? all.filter((o) => o.status === 'collected') : all;
    const nextLabel = { received: 'Start brewing', brewing: 'Ready · call code', ready: 'Collected · add points' };
    return `<div class="tiles">
      <div class="tile"><small>In the queue</small><b>${active.length}</b><span>${active.filter((o) => o.status === 'ready').length} ready to collect</span></div>
      <div class="tile"><small>Today</small><b>${money(todays.reduce((a, o) => a + (+o.total || 0), 0))}</b><span>${todays.length} order${todays.length === 1 ? '' : 's'}, after free drinks</span></div>
      <div class="tile"><small>App ordering</small><b>${isOpen() ? 'On' : 'Off'}</b><span><button class="btn sm ghost" data-act="toggle-open" ${S.busy ? 'disabled' : ''}>${isOpen() ? 'Pause orders' : 'Resume orders'}</button></span></div>
    </div>

    <div class="list">${!list.length ? `<div class="empty"><b>${S.qFilter === 'active' ? 'Queue is clear' : 'Nothing here yet'}</b>New app orders appear here the moment they're placed, oldest first.</div>` : list.map((o) => {
      const st = o.st();
      return `<article class="order">
        <div class="h"><span><span class="code" style="font-size:18px">${esc(o.code)}</span> · <b>${esc(o.cname)}</b></span><span class="pill ${o.status}">${STATUS[o.status]}</span></div>
        <div class="lines">${(o.lines || []).map((l) => `<b>${l.qty}×</b> ${esc(l.name)}${l.origin ? ` (${esc(origin(l.origin)?.name || '')})` : ''}${optText(l) ? ` — <b style="color:var(--ink)">${esc(optText(l))}</b>` : ''}`).join(' · ')}</div>
        <div class="hint">${o.milk ? esc(o.milk) + ' milk · ' + esc(o.sweet) + ' · ' : ''}${esc(o.slot)} · <b style="color:var(--ink)">${money(o.total)}</b> · ${fmt(o.createdAt)}</div>
        ${o.note ? `<p class="quote">${esc(o.note)}</p>` : ''}
        ${o.reward ? `<div class="hint warn"><b>Points reward:</b> ${esc(o.reward.name)} (−${o.reward.pts} pts) · ${money(o.discount)} off</div>` : ''}
        ${o.giftPay ? `<div class="hint"><b>Gift card:</b> ${money(o.giftPay)} paid in the app · take ${money(o.due ?? 0)}</div>` : ''}
        <div class="row">
          ${FLOW[o.status] ? `<button class="btn sm ${o.status === 'ready' ? 'ok' : ''}" data-act="status" data-c="${esc(o.cid)}" data-o="${esc(o.id)}" data-s="${FLOW[o.status]}" ${S.busy ? 'disabled' : ''}>${nextLabel[o.status]}</button>` : ''}
          ${o.status === 'collected' ? `<button class="btn sm ghost" data-act="status" data-c="${esc(o.cid)}" data-o="${esc(o.id)}" data-s="ready" ${S.busy ? 'disabled' : ''}>Undo</button>` : ''}
        </div>
      </article>`;
    }).join('')}</div>`;

  function subsDue() {
    const soon = addDays(ldate(), 3), out = [];

    return out.sort((a, z) => a.next.localeCompare(z.next));
  }
  function shopBar() {

        <div class="lines">${lines(o.lines)}</div>
        <div class="hint">${addr(o.delivery)}${o.email ? ' · ' + esc(o.email) : ''} · <b style="color:var(--ink)">${money(o.total)}</b> · ${fmt(o.createdAt)}</div>

  }
  // a new member's code is confirmed by staff once they have collected an order, so nobody can award themselves points
  function refsToConfirm() {

      const st = stats(c, S.bars[c.id]), by = S.customers.find((x) => x.id !== c.id && memberCode(x.id) === c.referredBy);
      return { c, by, ready: st.col.length + st.shopDone.length > 0 };

  }
  function members() {
    const rows = S.customers.map((c) => ({ c, st: stats(c, S.bars[c.id]) })).filter((r) => r.st.os.length || r.st.instore || r.st.credits || r.st.shop.length).sort((a, b) => b.st.lifetime - a.st.lifetime);
    return `<div class="panel stack">

  function bars(entries, fmtv) {

  // demo only: orders placed in the website's shop.html (same browser) join this member's history and the barista view
  let importing = false;
  function importWeb() {
    if (!S.demo || importing || !S.uid || !S.meLoaded) return;
    let web = []; try { web = JSON.parse(localStorage.getItem('bija.shop.orders')) || []; } catch {}
    const have = S.me?.shop || {}, shop = {}, subs = {};
    for (const o of Array.isArray(web) ? web : []) {
      if (!o || typeof o.id !== 'string' || have[o.id] || !Array.isArray(o.lines)) continue;
      // prices come from our catalogue, not from what the browser stored
      const lines = o.lines.filter((l) => l && product(l.id) && PLANS[l.plan] && +l.qty > 0).map((l) => ({ id: l.id, name: product(l.id).name, grind: GRINDS.includes(l.grind) ? l.grind : 'Whole bean', qty: Math.min(20, Math.round(+l.qty)), plan: l.plan, unit: unitOf(product(l.id), l.plan) }));
      if (!lines.length) continue;
      const method = o.delivery?.method === 'post' ? 'post' : 'collect', subtotal = r2(lines.reduce((a, l) => a + l.unit * l.qty, 0));
      const fee = method === 'post' && subtotal < FREE_POST && !lines.some((l) => l.plan !== 'once') ? POST : 0;
      const delivery = { method, fee, ...(method === 'post' ? { address: String(o.delivery?.address || '').slice(0, 120), postcode: String(o.delivery?.postcode || '').slice(0, 8).toUpperCase() } : {}) };
      const createdAt = isNaN(Date.parse(o.createdAt)) ? new Date().toISOString() : new Date(o.createdAt).toISOString();
      shop[o.id] = { code: String(o.code || 'W' + newCode().slice(1)).slice(0, 12), createdAt, name: String(o.name || '').slice(0, 60), email: String(o.email || '').slice(0, 80), lines, delivery, subtotal, total: r2(subtotal + fee), source: 'web' };
      Object.assign(subs, subsFrom(o.id, lines, createdAt, delivery));
    }
    if (!Object.keys(shop).length) return;
    importing = true;
    const first = Object.values(shop)[0];
    if (!S.form.name && first.name) S.form.name = first.name;
    saveMine({ shop, subs }).catch(() => {}).finally(() => { importing = false; });
  }

  async function finCsv() {
    const k = finCalc(), rows = k.inP.slice().sort((a, b) => a.date.localeCompare(b.date) || String(a.at).localeCompare(String(b.at)));
    const cell = (v) => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const n2 = (n) => pen(n).toFixed(2), tin = rows.reduce((a, e) => a + Math.max(0, flow(e)), 0), tout = rows.reduce((a, e) => a + Math.max(0, -flow(e)), 0);
    const lines = [['Date', 'Type', 'Category', 'Note', 'Paid by', 'Card', 'Cash', 'In', 'Out'],
      ...rows.map((e) => { const v = flow(e); return [e.date, KIND[e.kind] || e.kind, e.cat || '', e.note || '', PAID_BY[e.paidBy] || '', e.kind === 'close' ? n2(e.card) : '', e.kind === 'close' ? n2(e.cash) : '', v > 0 ? n2(v) : '', v < 0 ? n2(-v) : '']; }),
      ['Total', '', '', `${k.from} to ${k.to}`, '', '', '', n2(tin), n2(tout)]];
    const csv = '﻿' + lines.map((r) => r.map(cell).join(',')).join('\r\n') + '\r\n', filename = `bija-cash-flow-${k.from}-to-${k.to}.csv`;
    if (S.demo) {
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      return toast('CSV downloaded');
    }
    try { const dl = await window.claude.use('downloads'); if (!dl) throw new Error('no downloads'); await dl.save({ filename, data: csv }); toast('CSV saved'); }
    catch { toast('Couldn’t export the CSV. Try again.'); }
  }

      if (!/^BIJA-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) { toast('Codes look like BIJA-XXXX-XXXX.'); return document.getElementById('g-redeem')?.focus(); }
      if (S.me?.claims?.[code] && !S.me.claims[code].rejected) return toast('You already added this code.');
      run(async () => { await saveMine({ claims: { [code]: { at: new Date().toISOString() } } }); S.redeemCode = ''; }, 'Code sent. The bar will confirm it.');
    }
    else if (a === 'gpaid') run(() => saveBar(b.dataset.c, { giftsPaid: { [b.dataset.g]: new Date().toISOString() } }), 'Gift card activated');
    else if (a === 'gok') {
      const cid = b.dataset.c, code = b.dataset.code, g = giftData().gifts.find((x) => x.code === code);
      if (!g || !g.paid || g.used) return toast('This code can’t be used.');
      const at = new Date().toISOString(), credit = { credits: { [code]: { amount: g.amount, gid: g.gid, buyer: g.buyer, at } } };
      run(async () => {
        if (g.buyer === cid) await saveBar(cid, { ...credit, giftsRedeemed: { [g.gid]: at } });
        else { await saveBar(cid, credit); await saveBar(g.buyer, { giftsRedeemed: { [g.gid]: at } }); }
      }, `${money(g.amount)} added to their balance`);
    }
    else if (a === 'gno') run(() => S.db.doc('customers/' + b.dataset.c).update({ claims: { [b.dataset.code]: { rejected: true } } }), 'Code rejected');
    else if (a === 'instore') {
      const code = S.instore.code.trim().toUpperCase(), amount = Math.round((+S.instore.amount || 0) * 100) / 100;
      const c = S.customers.find((x) => memberCode(x.id) === code);
      if (!c) return toast('No member with that code.');
      if (!(amount > 0 && amount <= 500)) return toast('Enter the amount paid, up to £500.');
      const id = 's' + Date.now().toString(36);
      const dbl = !!S.instore.double;
      run(async () => { await saveBar(c.id, { instore: { [id]: { amount, at: new Date().toISOString(), ...(dbl ? { double: true } : {}) } } }); S.instore = { code: '', amount: '' }; }, `Added ${Math.round(amount * PTS * (dbl ? 2 : 1))} points for ${c.name || 'member'}`);
    }
    else if (a === 'toggle-open') run(() => S.db.doc('config/current').update({ open: !isOpen() }), isOpen() ? 'App ordering paused' : 'App ordering resumed');
    else if (a === 'reset-draft') { S.draft = null; render(); }
    else if (a === 'fper') { S.fin.period = b.dataset.v; S.fin.del = null; render(); }
    else if (a === 'fkind') { S.fin.exp.kind = b.dataset.v; render(); }
    else if (a === 'fpaid') { S.fin.exp.paidBy = b.dataset.v; render(); }
    else if (a === 'fclose') finClose();
    else if (a === 'fexp') finExp();
    else if (a === 'fsave') finSave();
    else if (a === 'fcsv') finCsv();
    else if (a === 'fsettings') {
      S.fin.showSet = !S.fin.showSet;
      if (S.fin.showSet) { const s = finSet(); S.fin.set = { openBal: s.openBal == null ? '' : String(s.openBal), openDate: s.openDate || '', margin: String(s.margin), ppv: String(s.ppv), vat: !!s.vat }; }
      render();
    }
    else if (a === 'fdel') {
      const id = b.dataset.id;
      if (S.fin.del !== id) { S.fin.del = id; render(); return; }
      S.fin.del = null; run(() => finRef(id).delete(), 'Entry deleted');
    }
    else if (a === 'save-cfg') {
      const d = S.draft;
      const next = { ...d, open: !!d.open, note: (d.note || '').trim(), menu: d.menu.filter((m) => m.name.trim()).map((m) => ({ ...m, name: m.name.trim(), price: Math.max(0, +m.price || 0), available: !!m.available })) };
      if (!next.menu.length) return toast('Add at least one item.');
      run(async () => { await S.db.doc('config/current').set(next); S.draft = null; }, S.config ? 'Menu saved' : 'Menu is live');
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('g.pin[data-act], .flip[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
  document.addEventListener('input', (e) => {
    const el = e.target, val = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.f) { S.form[el.dataset.f] = val; if (el.dataset.f === 'name') store.set('bija.name', val); if (el.type === 'checkbox') render(); }
    else if (el.dataset.rc) (S.rate[el.dataset.rc] ||= { stars: 0, comment: '' }).comment = val;
    else if (el.id === 'bm') S.bdayPick = val;
    else if (el.dataset.g) { S.gift[el.dataset.g] = val; if (el.dataset.g === 'custom') render(); }
    else if (el.hasAttribute('data-redeem')) S.redeemCode = val;
    else if (el.dataset.is) S.instore[el.dataset.is] = val;
    else if (el.dataset.pick) { const [id, k] = el.dataset.pick.split(':'); if (k === 'grind' && GRINDS.includes(val)) pickOf(id).grind = val; if (k === 'freq' && planDays(val)) pickOf(id).freq = val; }
    else if (el.dataset.sf) S.sf[el.dataset.sf] = val;
    else if (el.hasAttribute('data-ref')) S.refCode = val;
    else if (el.dataset.sub) {
      const [id, k] = el.dataset.sub.split(':'), x = mine().subs.find((y) => y.id === id); if (!x) return;
      if (k === 'grind' && GRINDS.includes(val) && val !== x.grind) run(() => saveMine({ subs: { [id]: { grind: val } } }), `Grind changed to ${val}`);
      if (k === 'plan' && planDays(val) && val !== x.plan) run(() => saveMine({ subs: { [id]: { plan: val, start: x.next || addDays(ldate(), 2) } } }), `Now ${PLANS[val].toLowerCase()}`);
    }
    else if (el.dataset.d && S.draft) S.draft[el.dataset.d] = val;
    else if (el.dataset.m && S.draft) S.draft.menu[+el.dataset.m][el.dataset.k] = val;
    else if (el.dataset.fin) {
      const [g, k] = el.dataset.fin.split(':'); if (!S.fin[g]) return;
      S.fin[g][k] = val;
      if (g === 'close' && k === 'date') { // a date that already has a close loads it, so saving edits (replaces) it
        const ex = S.fin.entries.find((x) => x.id === 'close-' + val);
        if (ex) S.fin.close = { date: val, card: String(ex.card ?? ''), cash: String(ex.cash ?? ''), note: ex.note || '', pre: true };
        else if (S.fin.close.pre) S.fin.close = { date: val, card: '', cash: '', note: '', pre: false };
        render();
      } else if (g === 'close') S.fin.close.pre = false;
    }
  });

  // ---------- local demo store: same calls as the db capability, kept in this browser ----------
  function demoDb() {
    const KEY = 'bija.app.demo';
    let data = {}; try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
    const subs = new Set(), clone = (v) => v === undefined ? v : JSON.parse(JSON.stringify(v));
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} setTimeout(() => subs.forEach((f) => f()), 0); };
    const merge = (t, p) => { for (const [k, v] of Object.entries(p)) { if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) merge(t[k], v); else t[k] = clone(v); } };
    const snap = (p) => ({ id: p.split('/').pop(), exists: p in data, data: () => clone(data[p]) });
    if (!data['config/current']) data['config/current'] = clone(STARTER);
    return {
      doc: (p) => ({
        get: async () => snap(p),
        set: async (v) => { data[p] = clone(v); save(); },
        update: async (v) => { if (!(p in data)) throw { code: 'not_found' }; merge(data[p], v); save(); },
        delete: async () => { delete data[p]; save(); },
        onSnapshot: (cb) => { const f = () => cb(snap(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
      }),
      collection: (p) => ({
        onSnapshot: (cb) => {
          const depth = p.split('/').length + 1;
          const f = () => cb({ docs: Object.keys(data).filter((k) => k.startsWith(p + '/') && k.split('/').length === depth).map(snap) });
          subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
        },
      }),
    };
  }

  // ---------- boot ----------
  try { const v = new URLSearchParams(location.search).get('view'); if (v === 'app' || v === 'site') localStorage.setItem('bija.view', v); } catch {}
  if (['#home', '#order', '#beans', '#card', '#gifts', '#secret', '#orders', '#club'].includes(location.hash)) S.tab = location.hash.slice(1);
  try { S.lastOpts = JSON.parse(localStorage.getItem('bija.opts')) || {}; } catch {}
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; render(); });
  S.form.name = store.get('bija.name') || '';
  try { const r = new URLSearchParams(location.search).get('ref'); if (r && /^BIJA-[A-Z0-9]{2,5}$/i.test(r)) { S.refCode = r.toUpperCase(); if (!location.hash) S.tab = 'card'; } } catch {}
  S.theme = store.get('bija.theme') || 'noir';
  render();
  function listen(db) {
    db.doc('config/current').onSnapshot((s) => { S.config = s.exists ? s.data() : null; S.configLoaded = true; if (S.config && !(S.config.slots || []).includes(S.form.slot)) S.form.slot = (S.config.slots || ['ASAP'])[0]; render(); }, () => { S.configLoaded = true; render(); });
    if (S.uid) {
      db.doc('customers/' + S.uid).onSnapshot((s) => {
        S.me = s.exists ? s.data() : null; S.meLoaded = true;
        if (S.me && !S.form.name) S.form.name = S.me.name || '';
        importWeb();
        render();
      }, () => { S.meLoaded = true; render(); });
      db.doc('bar/' + S.uid).onSnapshot((s) => {
        const before = stats(S.me, S.bar);
        S.bar = s.exists ? s.data() : null;
        const after = stats(S.me, S.bar);
        if (S.barLoaded && S.meLoaded) {
          const dealt = after.dealt.length > before.dealt.length ? after.dealt[after.dealt.length - 1] : null;
          if (dealt) { S.dealt = dealt.id; S.spot = dealt.id; }
          const gained = after.lifetime - before.lifetime, topped = after.credits - before.credits;
          if (gained > 0) { S.bump = true; setTimeout(() => { S.bump = false; }, 800); }
          if (gained > 0 || topped > 0) toast([gained > 0 ? `+${gained} points` : '', dealt ? 'a new secret card' : '', topped > 0 ? `${money(topped)} gift card added` : ''].filter(Boolean).join(' · '));
        }
        S.barLoaded = true; render();
      }, () => { S.barLoaded = true; render(); });
    } else S.meLoaded = true;
    if (S.admin) {
      db.collection('customers').onSnapshot((q) => { S.customers = q.docs.map((d) => ({ id: d.id, ...d.data() })); S.custLoaded = true; render(); }, () => { S.custLoaded = true; render(); });
      db.collection('bar').onSnapshot((q) => { S.bars = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); render(); }, () => render());
      if (S.demo) addEventListener('storage', (e) => { if (e.key === 'bija.shop.orders') importWeb(); if (e.key === 'bija.shop.cart') render(); });
      db.collection('finance').onSnapshot((q) => {
        const docs = q.docs.map((d) => ({ id: d.id, ...d.data() }));
        S.fin.settings = docs.find((d) => d.id === 'settings') || null;
        S.fin.entries = docs.filter((d) => d.id !== 'settings' && KIND[d.kind] && isDate(d.date));
        S.fin.loaded = true; S.fin.err = false; render();
      }, () => { S.fin.loaded = true; S.fin.err = true; render(); });
    }
    render();
  }
  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      // standalone hosting (GitHub Pages): make it installable and work offline
      if (/^https?:$/.test(location.protocol)) {
        document.head.insertAdjacentHTML('beforeend', '<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Bija">');
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      }
      S.demo = true; S.db = demoDb(); S.uid = 'you'; S.admin = true; listen(S.db); return; }
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db) { S.noDb = true; render(); return; }
    S.db = db; S.user = user;
    S.uid = user ? await user.id() : null;
    S.admin = user ? await user.canEdit() : false;
    listen(db);
  })();
})();
</script>
