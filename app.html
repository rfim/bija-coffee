.greet.q { font: 800 clamp(28px, 8.4vw, 38px)/1.05 var(--display); text-transform: none; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.hband .sub { margin: 8px 0 0; font: 500 13px var(--sans); color: var(--muted); }
.avatar { position: absolute; top: 20px; right: 16px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #0b0b0b; color: #fff; display: grid; place-items: center; font: 800 18px var(--display); }
.avatar svg { width: 24px; height: 24px; }
.usual-card { display: grid !important; grid-template-columns: 88px minmax(0, 1fr); grid-template-rows: auto auto; gap: 12px 16px; align-items: start; padding: 16px; border-radius: 20px; background: var(--tile); color: var(--ink); }
.usual-card .uimg { width: 88px; height: 88px; aspect-ratio: 1; border-radius: 14px; grid-row: 1 / span 2; background: #f1eee8; padding: 6px; }
.usual-card .uimg img { inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); border-radius: 10px; }
.usual-card .uimg svg.illo { width: 86%; height: 86%; }
.usual-card .uimg { color: #0b0b0b; position: relative; display: grid; place-items: center; overflow: hidden; }
.usual-card .uimg svg.illo :is(path, circle, ellipse, rect, line, polyline, polygon) { vector-effect: non-scaling-stroke; stroke-width: 1.6px; }
.usual-card .ub { display: grid; gap: 4px; min-width: 0; } .usual-card .ub b { font: 800 18px/1.1 var(--display); text-transform: uppercase; }
.usual-card .ub .hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.usual-card .price { font: 600 14px var(--sans); }
.usual-card .btn { grid-column: 2; justify-self: end; background: #0b0b0b; color: #fff; width: auto; }
.again2 { margin-top: 0; }
/* floating pill nav, inset 16px, content scrolls behind it */
.bnav { left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border-radius: 28px; border: 1px solid var(--line); background: rgba(255,255,255,.97); box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 0 8px 6px; max-width: 520px; margin: 0 auto; }
.bnav { left: 0; right: 0; width: calc(100% - 32px); max-width: 480px; margin-inline: auto; } /* a floating pill at every width */
.bnav .side::after { display: none; }
.bnav button.side { margin-top: 6px; border-radius: 20px; padding: 6px 0 4px; min-height: 52px; }
.bnav button.side[aria-current="page"] { background: #efedea; }
.basket { bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }
#toast { bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
/* wallet prompt */
#walletask { position: fixed; inset: 0; z-index: 55; display: grid; align-items: end; }
#walletask .wbg { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#walletask .wpan { position: relative; background: #fff; border-radius: 24px 24px 0 0; padding: 28px 24px calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 460px; width: 100%; margin: 0 auto; text-align: center; }
#walletask h2 { font: 900 26px/1 var(--display); text-transform: uppercase; margin: 0 0 8px; } #walletask p { margin: 0 0 20px; color: var(--muted); }
#walletask .wopts { display: grid; gap: 12px; justify-items: center; }
#walletask .wbadge { min-height: 52px; padding: 0; border: 0; background: none; border-radius: 12px; }
#walletask .wqr { display: grid; gap: 8px; justify-items: center; font-size: 13px; } #walletask .wqr svg { width: 160px; height: 160px; }
#walletask .wbtn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; margin: 0; } #walletask .wbtn svg { width: 22px; height: 22px; }
#walletask .wno { min-height: 44px; margin-top: 8px; border: 0; background: none; color: var(--ink); font: 600 14px var(--sans); text-decoration: underline; text-underline-offset: 3px; }
/* one family for every menu image: a warm tile, 10px inset, 12px corners; photos and drawings share the frame */
.prod .pimg, .prod .pimg.ill, .prod .pimg.bean { background: #f1eee8 none; color: #0b0b0b; padding: 10px; }
.prod .pimg img { inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); border-radius: 12px; }
.prod .pimg > svg.illo { width: 74%; height: 74%; }
.prod .pimg svg.illo :is(path, circle, ellipse, rect, line, polyline, polygon) { vector-effect: non-scaling-stroke; stroke-width: 1.75px; }
.prod .pimg .bagart { inset: 10px; border-radius: 12px; background: #e6e2da; }
.prod .pimg .flag { top: 16px; left: 16px; }
.prod .fav { top: 14px; right: 14px; }
/* categories fit the width (no half pill at rest); filters sit underneath as quiet text toggles */
.cats.sticky { -webkit-mask-image: none; mask-image: none; overflow: visible; display: flex; flex-wrap: wrap; gap: 6px; }
.cats.sticky::after { display: none; }
.cats.sticky button:not(.fpill) { flex: 1 1 auto; padding: 0 12px; font-size: 11.5px; letter-spacing: .02em; white-space: nowrap; text-align: center; }
@media (max-width: 380px) { .cats.sticky button:not(.fpill) { padding: 0 8px; font-size: 11px; letter-spacing: 0; } }
.cats.sticky .psep { flex-basis: 100%; height: 0; margin: 0; background: none; }
.cats.sticky .fpill { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; height: 44px; min-height: 44px; border: 0 !important; background: none !important; color: var(--muted) !important; padding: 0 8px; font: 600 12px/1 var(--sans); white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; }
.cats.sticky .fpill svg { width: 14px; height: 14px; flex: none; }
.cats.sticky .fpill[aria-pressed="true"] { color: var(--ink) !important; text-decoration-color: currentColor; }
.pimg .bagart { position: absolute; inset: 0; display: grid; place-items: center; }
/* bottom nav: three labels on one baseline, centre button raised a modest 16px, effects kept inside */
.bnav .in { align-items: end; }
.bnav .in > div { display: grid; justify-items: center; align-content: end; }
.bnav button.side { padding: 8px 0 0; gap: 4px; min-height: 52px; align-content: end; }
.bnav button.side, .fab-l { font: 600 10px/12px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
.fab { width: 60px; height: 60px; margin: -16px 20px 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.fab svg { width: 38px; height: 38px; }
.fab-l { margin-top: 4px; }
@keyframes fab-glow { 50% { box-shadow: 0 0 0 4px #fff, 0 0 0 6px rgba(46,125,50,.9); } }
.fab .hold-ring { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); pointer-events: none; transform: rotate(-90deg); opacity: 0; }
.fab svg.hold-ring { width: calc(100% + 10px); height: calc(100% + 10px); opacity: 0 !important; overflow: visible; }
.fab svg.hold-ring circle { fill: none !important; stroke: #0b0b0b; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 302; stroke-dashoffset: 302; }
.fab.holding svg.hold-ring { opacity: 1 !important; }
.fab.holding .hold-ring circle { animation: hold 3s linear forwards; } @keyframes hold { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .fab.holding .hold-ring circle { animation: none; stroke-dashoffset: 0; opacity: .5; } }
.bnav .side::after { bottom: auto; top: 0; }
.slide { aspect-ratio: 5 / 4; }
.bnav .ldot { position: absolute; top: 6px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px #fff; }
.bnav .ldot.rdy { background: #2e7d32; width: 11px; height: 11px; }
@media (prefers-reduced-motion: no-preference) { .bnav .ldot.rdy { animation: ldot 1.4s ease-in-out infinite; } @keyframes ldot { 50% { transform: scale(1.35); } } }
/* Home essentials and the More page */
.btn.xl { margin: 8px 0 24px; }
.again2 .again { background: var(--tile); color: var(--ink); border-radius: 16px; padding: 16px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.again2 .again .hint { color: var(--muted); display: block; margin-top: 4px; } .again2 .again .btn { width: auto; background: var(--ink); color: #fff; }
.usual-l { list-style: none; margin: 8px 0 0; padding: 0; }
.usual-l li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.usual-l li span { min-width: 0; } .usual-l small { display: block; color: var(--muted); }
.scantile { width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 72px; margin: 24px 0 8px; padding: 12px 16px; border: 0; border-radius: 16px; background: #0b0b0b; color: #fff; text-align: left; font: inherit; }
.scantile .sci { width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.5); display: grid; place-items: center; } .scantile svg { width: 28px; height: 28px; }
.scantile b { display: block; font: 800 18px/1 var(--display); text-transform: uppercase; } .scantile .hint { color: rgba(255,255,255,.75); }
.morelink { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0; margin: 8px 0 0; border: 0; background: none; color: var(--ink); font: 600 14px var(--sans); text-align: left; }
.ptitle { font: 900 40px/.95 var(--display); text-transform: uppercase; letter-spacing: -.02em; margin: 0 0 16px; }
.mlist { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid var(--line); }
.mlist li button { width: 100%; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: inherit; text-align: left; }
.mlist b { display: block; font: 800 16px/1.1 var(--display); text-transform: uppercase; } .mlist .hint { display: block; margin-top: 4px; }
/* Profile: live order, stamps tab and drawer, orders list, you, quiet details */
.lives { display: grid; gap: 12px; margin: 0 0 16px; }
.live { width: 100%; display: grid; gap: 6px; justify-items: start; padding: 16px; border: 0; border-radius: 20px; background: #0b0b0b; color: #fff; text-align: left; font: inherit; }
.live .eyebrow { color: rgba(255,255,255,.75); }
.live .lcode { font: 900 44px/.9 var(--display); letter-spacing: .04em; }
.live .litems { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.live .lmeta { font-size: 13px; color: rgba(255,255,255,.85); }
.live[data-status="ready"] { background: #fff; color: #0b0b0b; box-shadow: inset 0 0 0 3px #0b0b0b; } .live[data-status="ready"] .eyebrow, .live[data-status="ready"] .lmeta { color: #0b0b0b; }
.ltrack { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; } .ltrack.two { grid-template-columns: repeat(2, 1fr); }
.ltrack > span { display: grid; gap: 6px; font: 600 10px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.6); }
.ltrack i { height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }
.ltrack .done, .ltrack .now { color: currentColor; } .ltrack .done i, .ltrack .now i { background: currentColor; }
.live[data-status="ready"] .ltrack > span { color: #0b0b0b; } .live[data-status="ready"] .ltrack i { background: #0b0b0b; }
.stab { position: fixed; right: 0; top: 50%; z-index: 15; transform: translateY(-50%); width: 32px; min-height: 120px; padding: 12px 0; border: 0; border-radius: 12px 0 0 12px; background: #0b0b0b; color: #fff; display: grid; place-items: center; }
.stab span { writing-mode: vertical-rl; transform: rotate(180deg); font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.card-stage { position: relative; }
.pact { margin: 16px 0 8px; } .pact .btn { margin: 0; }
.ask { padding: 16px; border-radius: 16px; background: var(--tile); margin: 0 0 16px; } .ask h2 { font: 900 22px/1 var(--display); text-transform: uppercase; margin: 6px 0 8px; }
.olist { list-style: none; margin: 0; padding: 0; }
.olist li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.olist small { display: block; color: var(--muted); margin-top: 4px; }
.psec .hist { background: none; padding: 0; }
.you { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; margin-bottom: 12px; }
details.more-d { margin-top: 16px; border-top: 1px solid var(--line); }
details.more-d summary { min-height: 56px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; font: 800 16px var(--display); text-transform: uppercase; }
details.more-d summary::-webkit-details-marker { display: none; } details.more-d summary::after { content: "+"; font: 400 22px var(--sans); } details.more-d[open] summary::after { content: "−"; }
.earn-l { padding-left: 18px; line-height: 1.5; } .links { display: flex; gap: 16px; flex-wrap: wrap; } .links a { min-height: 44px; display: inline-flex; align-items: center; }
.plink { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
.visa.scanned { outline: 1.5px dashed var(--ink); outline-offset: -1.5px; }
.visa.soon { opacity: .55; }
/* stamp row on the card face (replaces the thin bar) */
.bcard .srow { margin-top: 3cqi; display: grid; grid-template-columns: repeat(10, 1fr); gap: 1.6cqi; }
.bcard .srow[data-act] { cursor: pointer; border-radius: 8px; }
.bcard .srow .st { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 1.2px dashed var(--c-empty); color: var(--c-empty); font: 700 clamp(5px, 1.7cqi, 8px)/1 var(--sans); letter-spacing: .02em; }
.bcard .srow .st.on { border: 0; background: var(--c-stamp); color: var(--c-stamp-ink); transform: rotate(var(--r, 0deg)); }
.bcard .srow .st.gift { border-style: solid; border-color: var(--c-stamp); color: var(--c-stamp); }
.bcard .srow .st.gift.on { background: var(--c-stamp); color: var(--c-stamp-ink); }
.bcard .srow .st svg { width: 70%; height: 70%; }
/* stamp drawer */
#stampdrawer { position: fixed; inset: 0; z-index: 45; }
#stampdrawer .sd-bg { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .25s; }
#stampdrawer .sd-pan { position: absolute; top: 0; right: 0; bottom: 0; width: min(86vw, 420px); background: #fff; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); touch-action: pan-y; }
#stampdrawer.show .sd-bg { opacity: 1; } #stampdrawer.show .sd-pan { transform: translateX(0); }
.sd-top { display: flex; align-items: center; justify-content: space-between; } .sd-top h2 { font: 900 30px/1 var(--display); text-transform: uppercase; margin: 0; }
.sd-x, .px, .sc-x { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--tile); font-size: 24px; line-height: 1; color: var(--ink); }
.sd-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 24px 0 16px; }
.sd-grid .st { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 2px dashed #b5b5b3; color: #6b6b6b; font: 700 12px var(--sans); }
.sd-grid .st.on { border: 0; background: #0b0b0b; color: #fff; transform: rotate(var(--r, 0deg)); } .sd-grid .st.on svg { width: 64%; height: 64%; }
.sd-grid .st.gift { border: 2px solid #0b0b0b; color: #0b0b0b; font-size: 11px; letter-spacing: .06em; } .sd-grid .st.gift.on { background: #0b0b0b; color: #fff; }
.sd-count { font-size: 15px; margin: 0 0 8px; } .sd-pan h3 { font: 800 16px var(--display); text-transform: uppercase; margin: 24px 0 8px; }
.sd-hist { list-style: none; padding: 0; margin: 0; } .sd-hist li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); } .sd-hist small { display: block; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { #stampdrawer .sd-pan, #stampdrawer .sd-bg { transition: none; } }
/* staff PIN sheet */
#pinsheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; }
#pinsheet .pbg { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
#pinsheet .ppan { position: relative; background: #fff; border-radius: 24px 24px 0 0; padding: 20px 24px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 420px; width: 100%; margin: 0 auto; text-align: center; }
#pinsheet .px { position: absolute; right: 12px; top: 12px; }
#pinsheet h2 { font: 900 24px/1 var(--display); text-transform: uppercase; margin: 8px 0 20px; }
.pdots { display: flex; justify-content: center; gap: 12px; } .pdots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #0b0b0b; } .pdots i.on { background: #0b0b0b; }
.pmsg { min-height: 20px; margin: 12px 0; font-size: 13px; color: var(--muted); }
.pkeys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: 0 auto; }
.pkeys button { min-height: 60px; border: 0; border-radius: 16px; background: var(--tile); font: 600 22px var(--sans); color: var(--ink); }
.pkeys button:active { background: #e3e3e1; }
@media (prefers-reduced-motion: no-preference) { .ppan.shake { animation: shake .4s; } @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } } }
@media (prefers-reduced-motion: reduce) { .ppan.shake .pdots i { border-color: #b3261e; } }
/* scanner */
#scanner { position: fixed; inset: 0; z-index: 50; background: #0b0b0b; color: #fff; display: grid; grid-template-rows: auto 1fr auto auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); gap: 16px; }
#scanner .sc-top { display: flex; align-items: center; justify-content: space-between; } #scanner .sc-top b { font: 900 24px var(--display); text-transform: uppercase; }
#scanner .sc-x { background: rgba(255,255,255,.15); color: #fff; }
#scanner .sc-view { position: relative; border-radius: 20px; overflow: hidden; background: #000; min-height: 0; }
#scanner video { width: 100%; height: 100%; object-fit: cover; }
#scanner .sc-frame { position: absolute; inset: 18%; border: 3px solid #fff; border-radius: 20px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
#scanner .sc-msg { font-size: 15px; line-height: 1.4; text-align: center; margin: 0; align-self: center; }
#scanner .sc-file { background: #fff; color: #0b0b0b; }
/* short screens: smaller hero and card so real content shows above the nav */
@media (max-height: 600px) {
  .greet { font-size: clamp(30px, 9vw, 40px); margin-bottom: 12px; }
  .slide { aspect-ratio: 16 / 9; } .slide .sl b { font-size: clamp(22px, 7vw, 30px); }
  .hc .bcard, .card-stage { width: 100%; min-width: min(280px, 100%); max-width: 320px; margin-inline: auto; justify-self: center; }
  .filter.slim { padding-block: 8px; }
}
/* finance v2: light and bold like the rest of the app, but quiet. A few big numbers, details one tap away, one main action, 8px rhythm */
.fin2 { display: grid; gap: 24px; }
.fin2 > * { margin: 0; }
.fin2 .hint { margin: 0; }
.fsubs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--paper); padding: 8px 0; margin: 0; }
.fsubs .fcount { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 8px; padding: 0 6px; border-radius: 999px; background: var(--warn); color: #fff; font: 700 11px/1 var(--sans); }
.fhead h2 { margin: 0; font: 900 clamp(32px, 8vw, 48px)/.92 var(--display); text-transform: uppercase; letter-spacing: -.02em; }
.fhead p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
.fbig { display: grid; gap: 8px; justify-items: start; }
.fbig small, .fh3, .kv dt { font: 600 12px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fbig b { font: 900 clamp(44px, 12vw, 72px)/.95 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.fbig p { margin: 0; color: var(--muted); font-size: 14px; max-width: 60ch; }
.fin2 .neg, .negc { color: var(--warn); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 16px; margin: 0; padding: 16px 0; border-block: 1px solid var(--line); }
.kv dd { margin: 4px 0 0; font: 800 20px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.fcta { display: flex; gap: 8px; flex-wrap: wrap; }
.fcta .btn { min-height: 48px; }
.fsec, .fchartwrap { display: grid; gap: 8px; }
.fh3 { margin: 0 0 8px; }
.fform { display: grid; gap: 16px; }
.fin2 .rw { padding: 8px 0; }
.lt { display: inline-flex; align-items: center; gap: 8px; font: 600 13px var(--sans); white-space: nowrap; }
.lt i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.lt.ok i { background: var(--leaf); } .lt.amber i { background: #b7791f; } .lt.bad i { background: var(--warn); } .lt.bad { color: var(--warn); }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--line); }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--ink); }
.meter em { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--muted); }
.todo { list-style: none; margin: 0; padding: 0; display: grid; }
.todo li { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line); }

    'Equipment & repairs': ['20', 'Repairs and maintenance', 'Grinder service, small kit'], 'Marketing': ['20', 'Advertising and marketing', 'Printing, ads, events'], 'Card & bank fees': ['exempt', 'Bank fees', 'Card machine and bank charges'],

  };
  const FIXED_CATS = new Set(['Rent & service charge', 'Business rates', 'Staff wages', 'Staff costs', 'Utilities', 'Software & subscriptions', 'Insurance', 'Professional fees']);

  const addDays = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

  const lastDay = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();

  function finRange(p, today = ldate()) {

  // ---------- local demo store: same calls as the db capability, kept in this browser ----------
  function demoDb() {
    const KEY = 'bija.app.demo';
    let data = {}; try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
    const subs = new Set(), clone = (v) => v === undefined ? v : JSON.parse(JSON.stringify(v));
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} setTimeout(() => subs.forEach((f) => f()), 0); };
    const merge = (t, p) => { for (const [k, v] of Object.entries(p)) { if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) merge(t[k], v); else t[k] = clone(v); } };
    const snap = (p) => ({ id: p.split('/').pop(), exists: p in data, data: () => clone(data[p]) });
    if (!data['config/current']) data['config/current'] = clone(STARTER);
    return {
      doc: (p) => ({
        get: async () => snap(p),
        set: async (v) => { data[p] = clone(v); save(); },
        update: async (v) => { if (!(p in data)) throw { code: 'not_found' }; merge(data[p], v); save(); },
        delete: async () => { delete data[p]; save(); },
        onSnapshot: (cb) => { const f = () => cb(snap(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
      }),
      collection: (p) => ({
        onSnapshot: (cb) => {
          const depth = p.split('/').length + 1;
          const f = () => cb({ docs: Object.keys(data).filter((k) => k.startsWith(p + '/') && k.split('/').length === depth).map(snap) });
          subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
        },
      }),
    };
  }

        S.bar = s.exists ? s.data() : null;
        const after = stats(S.me, S.bar);
        if (S.barLoaded && S.meLoaded) {
          const dealt = after.dealt.length > before.dealt.length ? after.dealt[after.dealt.length - 1] : null;
          if (dealt) { S.dealt = dealt.id; S.spot = dealt.id; }
          const gained = after.lifetime - before.lifetime, topped = after.credits - before.credits;
          if (gained > 0) { S.bump = true; setTimeout(() => { S.bump = false; }, 800); }
          if (gained > 0 || topped > 0) toast([gained > 0 ? `+${gained} points` : '', dealt ? 'a new secret card' : '', topped > 0 ? `${money(topped)} gift card added` : ''].filter(Boolean).join(' · '));
        }
        S.barLoaded = true; render();
      }, () => { S.barLoaded = true; render(); });
    } else S.meLoaded = true;
    if (S.admin) listenAdmin(db);
    render();
  }
  // staff data: attached at start for admins, or later when a staff PIN unlocks the shared backend
  function listenAdmin(db) {
    if (S.adminListening) return; S.adminListening = true;
    {
      db.collection('customers').onSnapshot((q) => { S.customers = q.docs.map((d) => ({ id: d.id, ...d.data() })); S.custLoaded = true; render(); }, () => { S.custLoaded = true; render(); });
      db.collection('bar').onSnapshot((q) => { S.bars = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); render(); }, () => render());
      if (S.demo) addEventListener('storage', (e) => { if (e.key === 'bija.shop.orders') importWeb(); if (e.key === 'bija.shop.cart') render(); });
      db.collection('finance').onSnapshot((q) => {
        const docs = q.docs.map((d) => ({ id: d.id, ...d.data() }));
        S.fin.settings = docs.find((d) => d.id === 'settings') || null;
        S.fin.entries = docs.filter((d) => d.id !== 'settings' && KIND[d.kind] && isDate(d.date));
        S.fin.bills = docs.filter((d) => d.kind === 'bill' && isDate(d.due) && +d.amount > 0);
        S.fin.loaded = true; S.fin.err = false; render();
      }, () => { S.fin.loaded = true; S.fin.err = true; render(); });
    }
    render();
  }
  addEventListener('DOMContentLoaded', () => { if (window.qrcode && (S.tab === 'card' || S.showScan)) render(); });
  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      // standalone hosting (GitHub Pages): make it installable and work offline
      if (/^https?:$/.test(location.protocol)) {
        document.head.insertAdjacentHTML('beforeend', '<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Bija">');
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      }
      // shared backend (Supabase, London) on the live site; this browser only with ?demo=1, on localhost, or if it can't be reached
      const qs = new URLSearchParams(location.search), local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      if (!qs.has('demo') && (qs.get('backend') === 'supabase' || (!local && location.protocol === 'https:'))) {
        try {
          const load = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
          if (!window.BijaSupabase) { if (!window.supabase) await load('vendor/supabase.js'); await load('bija-supabase.js'); }
          const conn = await window.BijaSupabase.connect();
          S.demo = true; S.backend = 'supabase'; S.sb = conn; S.db = conn.db; S.uid = conn.uid; S.admin = await conn.isStaff();
          conn.onStaffChange((on) => {
            if (on && !S.admin) { S.admin = true; listenAdmin(S.db); S.db.refreshAll(); lvRefresh(); }
            else if (!on && S.admin) { S.admin = false; S.staffOk = false; if (S.view === 'bar') S.view = 'customer'; }
            render();
          });
          listen(S.db);
          // ledgers: money, points and stamps from the server; refreshed whenever an order or ledger row changes
          if (conn.rpc) { lvRefresh(); conn.onLedgers?.(() => lvRefresh()); }
          return;
        } catch (e) { console.warn('Bija: shared backend unavailable, keeping data in this browser', e); S.offlineBackend = true; }
      }
      S.demo = true; S.db = demoDb(); S.uid = 'you'; S.admin = true; listen(S.db); return; }
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db) { S.noDb = true; render(); return; }
    S.db = db; S.user = user;
    S.uid = user ? await user.id() : null;
    S.admin = user ? await user.canEdit() : false;
    listen(db);
  })();
})();
</script>
