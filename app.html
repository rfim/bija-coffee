/* customer UX v2: sticky blurred header, floating basket, search, filters, favourites, onboarding, offline, undo, ETA */
:root { --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px; --sp6: 32px; --ease-spring: cubic-bezier(.2, .8, .2, 1); --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06); --shadow-2: 0 10px 30px rgba(0,0,0,.14); }

.pd-join { background: #0b0b0b; color: #fff; } .pd-join span:first-child { flex: 1; display: grid; gap: 3px; } .pd-join b { font: 600 17px/1.2 var(--sans); } .pd-join small { opacity: .8; font-size: 12.5px; } .pd-join .pc { color: #fff; }
.pd-stamps { background: var(--card); color: var(--ink); flex-wrap: wrap; } .pd-stamps .pl { flex: 1; }
.pd-dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; width: 100%; } .pd-dots i { aspect-ratio: 1; border-radius: 50%; border: 1.5px solid #b9b8b3; } .pd-dots i.on { background: #0b0b0b; border-color: #0b0b0b; } .pd-dots i.free { border-style: dashed; border-color: #0b0b0b; }

.pc { font-size: 22px; color: var(--muted); flex: none; }
.stx-h { margin: 6px 0 10px; font: 900 34px/1 var(--display); letter-spacing: -.02em; }
.stx-lead { margin: 0 0 16px; color: #3a3a3a; font-size: 15px; line-height: 1.5; }
.stx-chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -2px 8px; padding: 2px; scrollbar-width: none; } .stx-chips::-webkit-scrollbar { display: none; }

.stx-ch { margin: 26px 0 12px; font: 900 22px/1.1 var(--display); letter-spacing: -.01em; scroll-margin-top: calc(var(--hdr, 61px) + 12px); }

.stx-tx details[open] summary { display: none; }
.stx-more { margin: 18px 0 0; text-align: center; font-size: 14px; } .stx-more a { color: var(--ink); }
.vx-hero { border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 10; background: var(--tile); margin: 0 0 16px; } .vx-hero img { width: 100%; height: 100%; object-fit: cover; display: block; } .vx-hero img.low { object-position: 50% 72%; }
.vx-open { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 600 14px var(--sans); color: var(--muted); } .vx-open i { width: 8px; height: 8px; border-radius: 50%; background: #b9b9b6; } .vx-open.on { color: var(--ink); } .vx-open.on i { background: #2e7d32; }

.vx-hours { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); } .vx-hours li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 15px; } .vx-hours li.now { font-weight: 700; } .vx-hours li span:last-child { color: #3a3a3a; text-align: right; }
.vx-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 62%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -2px; padding: 2px; scrollbar-width: none; } .vx-strip::-webkit-scrollbar { display: none; }
.vx-strip div { scroll-snap-align: start; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 5; background: var(--tile); } .vx-strip img { width: 100%; height: 100%; object-fit: cover; display: block; }

.vx-social { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 22px 0 0; font: 600 14px var(--sans); } .vx-social a { color: var(--ink); min-height: 44px; display: inline-flex; align-items: center; }
.cx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .cx-grid div { background: var(--tile); border-radius: 16px; padding: 16px; } .cx-grid h4 { margin: 0 0 6px; font: 800 16px/1.2 var(--display); } .cx-grid p { margin: 0; font-size: 13.5px; line-height: 1.45; color: #2f2f2f; }
.ex-pack { background: var(--tile); border-radius: 18px; padding: 18px; margin: 0 0 12px; } .ex-pack h4 { margin: 4px 0 4px; font: 900 24px/1 var(--display); } .ex-price { margin: 0 0 10px; font-size: 14px; color: #3a3a3a; } .ex-price b { color: var(--ink); }

.pd-sub { margin-top: 18px; padding-top: 6px; border-top: 6px solid var(--card); } .pd-sub .pi { background: transparent; } .pd-sub b { font-weight: 500; }
.pd-acct { margin: 20px 0 8px; font-size: 13px; color: var(--muted); text-align: center; } .pd-out { width: 100%; }
.pd-back { margin: 2px 0 6px; min-height: 44px; }
@media (prefers-reduced-motion: no-preference) { .pd-view { animation: pdin .32s cubic-bezier(.22, 1, .36, 1); } @keyframes pdin { from { opacity: 0; transform: translateX(18px); } } }
.mlist button { gap: 14px; } .mlist .mi { width: 40px; height: 40px; border-radius: 12px; background: var(--card); display: grid; place-items: center; flex: none; } .mlist .mi svg { width: 24px; height: 24px; } .mlist button > span:nth-of-type(2) { flex: 1; }
/* the side panel sits on a light veil with a soft edge shadow; the page behind does not move */
#stampdrawer .sd-pan { box-shadow: -12px 0 40px rgba(0,0,0,.10); }

.login .sso svg { width: 20px; height: 20px; } .login .sso.apple { background: #000; color: #fff; border: 0; } .login .sso.google { background: #fff; color: #1f1f1f; border: 1px solid #c9c9c5; }

.pw { position: relative; display: block; } .pw input { width: 100%; padding-right: 72px; } .pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); min-height: 40px; min-width: 56px; border: 0; background: none; font: 600 13px var(--sans); color: var(--ink); cursor: pointer; }

#pinsheet.secret .px { color: #fff; background: rgba(255,255,255,.12); border: 0; } .top .logo .mark { transform-origin: 50% 50%; transform-box: fill-box; } #pinsheet.secret .pmsg { color: rgba(255,255,255,.7); }

#whisper { position: fixed; left: 50%; top: calc(68px + var(--sa-top)); transform: translate(-50%, -6px); z-index: 60; padding: 6px 12px; border-radius: 999px; background: #0b0b0b; color: #fff; font: 600 12px var(--sans); letter-spacing: .04em; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }

.pd-view.still { animation: none !important; }
.lg-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; } .lg-foot .back { min-height: 44px; } .lg-foot .back[disabled] { opacity: .55; }
/* Back office: functional over decorative (Oct 2026). Plain sentence-case type, square compact controls, tabular numbers,
   quiet empty states; on wide screens a sidebar with counts and number-key shortcuts. Customer screens are untouched. */
body.barista-view #main :is(h1, h2, h3, h4, .sec-h h2, .sec-h h3, .fh3, .empty b) { font-family: var(--sans); font-weight: 600; text-transform: none; line-height: 1.25; }
body.barista-view #main :is(h2, .sec-h h2) { font-size: 20px; } body.barista-view #main :is(h3, .sec-h h3, .fh3) { font-size: 16px; }

body.barista-view #main { font-variant-numeric: tabular-nums; }

body.barista-view .tabs button { border-radius: 6px; border-width: 1px; min-height: 44px; padding: 0 12px; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; }
body.barista-view .tabs kbd { display: none; }
body.barista-view #main :is(.cats, .opts) button { border-radius: 6px; border-width: 1px; min-height: 44px; min-width: 44px; padding: 0 12px; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 600; }
body.barista-view #main .btn { text-transform: none; letter-spacing: 0; }
body.barista-view #main .fbig { font-size: 32px; }
body.barista-view .top .brand h1 { text-transform: none; }
@media (max-width: 599px) { body.barista-view .top, body.barista-view .top:has(#switch:not([hidden])) { grid-template-columns: minmax(0, 1fr); } body.barista-view .top .logo { display: none; } body.barista-view .top .lft { display: none; } body.barista-view #switch { margin-left: auto; } body.barista-view .top .rgt { flex: 1; min-width: 0; } body.barista-view #switch { width: 100%; } .bo-who { flex: 1; min-width: 0; max-width: none; } }
body.barista-view .top .logo .mark, body.barista-view .top .brand p { display: none; }
body.barista-view .top .brand h1 { font: 600 18px/1 var(--sans); letter-spacing: 0; }
.bo-who { font-size: 12px; color: var(--muted); margin-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
.bo-who i { font-style: normal; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); margin-right: 6px; vertical-align: 1px; }

@media (min-width: 900px) {

  body.barista-view #wrap > .top, body.barista-view #demo { grid-column: 1 / -1; }

  body.barista-view .tabs button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; color: var(--ink); text-align: left; }
  body.barista-view .tabs button:hover { background: var(--card); }

  body.barista-view .tabs .dot { margin-left: auto; }

  body.barista-view .tabs .dot + kbd { margin-left: 6px; } body.barista-view .tabs button:not(:has(.dot)) kbd { margin-left: auto; }

/* Menu as one list (Nov 2026, after Grind): a section per category, compact rows with the photo on the left,
   three to four items per phone screen, and a sticky category bar that follows the scroll */
.cats.sticky.spy { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 6px; margin: 8px -16px 0; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.cats.sticky.spy::-webkit-scrollbar { display: none; }
.cats.sticky.spy button { flex: 0 0 auto; padding: 0 16px; }
.mcat { scroll-margin-top: calc(var(--hdr, 0px) + 70px); }
.mcat-h { margin: 20px 0 2px; font: 600 18px/1.3 var(--sans); }
.menu.rows { display: block; }
.menu.rows .prod { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: start; padding: 14px 0; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; overflow: visible; }
.menu.rows .prod:last-child { border-bottom: 0; }

.menu.rows .pb { padding: 0; gap: 2px; }
.menu.rows .ph { display: flex; align-items: flex-start; gap: 4px; }
.menu.rows .prod h4 { flex: 1; min-height: 0; margin: 2px 0 0; font: 600 16px/1.25 var(--sans); display: block; overflow: visible; }
.menu.rows .ptag { display: inline-block; margin-left: 4px; padding: 1px 8px; border: 1px solid var(--ink); border-radius: 999px; font: 600 11px/1.5 var(--sans); vertical-align: 2px; white-space: nowrap; }
.menu.rows .fav { position: static; flex: none; width: 44px; height: 44px; margin: -10px -12px -10px 0; background: none; box-shadow: none; }

.rtile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 104px; padding: 14px; border: 0; border-radius: 16px; background: var(--tile); color: var(--ink); text-align: left; font: inherit; cursor: pointer; }

/* Create subscription motion styles (?subfx=). Only what just changed animates, and only transform, opacity (and a small blur in 2) */
@media (prefers-reduced-motion: no-preference) {
  .sw[data-subfx].in { animation: none; }
  /* 1 lift and tick */
  .sw[data-subfx="1"].in { animation: sf1-up .55s cubic-bezier(.32,.72,0,1); } @keyframes sf1-up { from { transform: translate3d(0, 100%, 0); } }
  .sw[data-subfx="1"] .sw-t.just { animation: sf1-tap .42s cubic-bezier(.32,.72,0,1); } @keyframes sf1-tap { 0% { transform: scale(.95); } 55% { transform: scale(1.03); } 100% { transform: none; } }
  .sw[data-subfx="1"] .sw-s.answered .sw-n { animation: sf1-tick .45s cubic-bezier(.32,.72,0,1); } @keyframes sf1-tick { from { transform: rotate(-90deg) scale(.6); opacity: .3; } }
  .sw[data-subfx="1"] .sw-s.unlock { animation: sf1-in .45s cubic-bezier(.32,.72,0,1); } @keyframes sf1-in { from { opacity: .38; transform: translate3d(0, 12px, 0); } }
  /* 2 soft focus */
  .sw[data-subfx="2"].in { animation: sf2-in .5s cubic-bezier(.32,.72,0,1); } @keyframes sf2-in { from { opacity: 0; transform: scale(.97); } }
  .sw[data-subfx="2"] .sw-s.unlock { animation: sf2-focus .6s cubic-bezier(.32,.72,0,1); } @keyframes sf2-focus { from { opacity: .38; filter: blur(6px); } }
  .sw[data-subfx="2"] .sw-t.just::after { content: ""; position: absolute; inset: -1.5px; border-radius: 16px; border: 2px solid var(--ink); animation: sf2-ring .45s cubic-bezier(.32,.72,0,1) forwards; pointer-events: none; }
  .sw[data-subfx="2"] .sw-t { position: relative; } @keyframes sf2-ring { from { transform: scale(1.08); opacity: 0; } to { transform: none; opacity: 0; } 60% { opacity: 1; } }
  /* 3 cascade */
  .sw[data-subfx="3"].in { animation: sf1-up .5s cubic-bezier(.32,.72,0,1); }
  .sw[data-subfx="3"] .sw-s.unlock .sw-t { animation: sf3-drop .5s cubic-bezier(.32,.72,0,1) both; }
  .sw[data-subfx="3"] .sw-s.unlock .sw-t:nth-child(2) { animation-delay: .05s; } .sw[data-subfx="3"] .sw-s.unlock .sw-t:nth-child(3) { animation-delay: .1s; } .sw[data-subfx="3"] .sw-s.unlock .sw-t:nth-child(4) { animation-delay: .15s; } .sw[data-subfx="3"] .sw-s.unlock .sw-t:nth-child(5) { animation-delay: .2s; } .sw[data-subfx="3"] .sw-s.unlock .sw-t:nth-child(n+6) { animation-delay: .25s; }
  @keyframes sf3-drop { from { opacity: 0; transform: translate3d(0, 18px, 0); } }
  .sw[data-subfx="3"] .sw-t.just { animation: sf1-tap .4s cubic-bezier(.32,.72,0,1); }
  /* 4 slide along */
  .sw[data-subfx="4"].in { animation: sf4-in .5s cubic-bezier(.32,.72,0,1); } @keyframes sf4-in { from { transform: translate3d(100%, 0, 0); } }
  .sw[data-subfx="4"] .sw-s.unlock { animation: sf4-step .5s cubic-bezier(.32,.72,0,1); } @keyframes sf4-step { from { opacity: .38; transform: translate3d(28px, 0, 0); } }
  .sw[data-subfx="4"] .sw-body.rv-in { animation: sf4-step .45s cubic-bezier(.32,.72,0,1); }
  .sw[data-subfx="4"] .sw-body.rv-back { animation: sf4-back .45s cubic-bezier(.32,.72,0,1); } @keyframes sf4-back { from { opacity: .4; transform: translate3d(-28px, 0, 0); } }
  .sw[data-subfx="4"] .sw-t.just { animation: sf1-tap .4s cubic-bezier(.32,.72,0,1); }
  /* 5 spring cards */
  .sw[data-subfx="5"].in { animation: sf5-up .7s cubic-bezier(.3,1.25,.5,1); } @keyframes sf5-up { from { transform: translate3d(0, 100%, 0); } }
  .sw[data-subfx="5"] .sw-s.unlock .sw-g { perspective: 800px; }
  .sw[data-subfx="5"] .sw-s.unlock .sw-t { animation: sf5-flip .6s cubic-bezier(.3,1.25,.5,1) both; transform-origin: 50% 100%; }
  .sw[data-subfx="5"] .sw-s.unlock .sw-t:nth-child(2n) { animation-delay: .06s; } .sw[data-subfx="5"] .sw-s.unlock .sw-t:nth-child(n+3) { animation-delay: .12s; } .sw[data-subfx="5"] .sw-s.unlock .sw-t:nth-child(n+5) { animation-delay: .18s; }
  @keyframes sf5-flip { from { opacity: 0; transform: rotateX(-65deg); } }
  .sw[data-subfx="5"] .sw-t.just { animation: sf5-bounce .55s cubic-bezier(.3,1.5,.5,1); } @keyframes sf5-bounce { 0% { transform: scale(.9); } 100% { transform: none; } }
  .sw[data-subfx="1"] .sw-body.rv-in, .sw[data-subfx="2"] .sw-body.rv-in, .sw[data-subfx="3"] .sw-body.rv-in, .sw[data-subfx="5"] .sw-body.rv-in { animation: sf1-in .45s cubic-bezier(.32,.72,0,1); }
}

  function demoDb() {
    const KEY = 'bija.app.demo';
    let data = {}; try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
    const subs = new Set(), clone = (v) => v === undefined ? v : JSON.parse(JSON.stringify(v));
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} setTimeout(() => subs.forEach((f) => f()), 0); };
    const merge = (t, p) => { for (const [k, v] of Object.entries(p)) { if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) merge(t[k], v); else t[k] = clone(v); } };
    const snap = (p) => ({ id: p.split('/').pop(), exists: p in data, data: () => clone(data[p]) });
    if (!data['config/current']) data['config/current'] = clone(STARTER);
    return {
      doc: (p) => ({
        get: async () => snap(p),
        set: async (v) => { data[p] = clone(v); save(); },
        update: async (v) => { if (!(p in data)) throw { code: 'not_found' }; merge(data[p], v); save(); },
        delete: async () => { delete data[p]; save(); },
        onSnapshot: (cb) => { const f = () => cb(snap(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
      }),
      collection: (p) => ({
        onSnapshot: (cb) => {
          const depth = p.split('/').length + 1;
          const f = () => cb({ docs: Object.keys(data).filter((k) => k.startsWith(p + '/') && k.split('/').length === depth).map(snap) });
          subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
        },
      }),
    };
  }

    o.innerHTML = `<div class="ob-top"><button class="ob-back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button><button class="ob-skip" type="button">Skip</button></div>`
      + P.map((x, i) => `<section class="ob-s" data-i="${i}" aria-hidden="true"><h2>${W(x.h)}</h2><p>${esc(x.p)}</p>`
        + (x.img ? `<div class="ob-ph"><img src="${x.img}" alt="" decoding="async" style="object-position:${x.pos}"></div>` : `<svg class="ob-mk" viewBox="-4 -4 108 108" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5"><circle cx="50" cy="25" r="25"/><circle cx="75" cy="50" r="25"/><circle cx="50" cy="75" r="25"/><circle cx="25" cy="50" r="25"/></g></svg>`
          + `<div class="ob-acct"><button class="ob-b ob-k" type="button" data-p="apple">${ICON_APPLE}<span>Continue with Apple</span></button><button class="ob-b" type="button" data-p="google">${ICON_GOOGLE}<span>Continue with Google</span></button><button class="ob-b ob-guest" type="button">Continue as guest</button><p class="ob-fine">By continuing you agree to our <a href="delivery.html#terms">terms</a> and <a href="privacy.html">privacy notice</a>.</p></div>`)
        + '</section>').join('')
      + '<div class="ob-foot"><div class="ob-dots" aria-hidden="true"><i></i><i></i><i></i></div><button class="ob-go" type="button" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button></div>';
    document.body.appendChild(o); document.body.classList.add('ob-open');
    let cur = -1, done = false;
    const secs = [...o.querySelectorAll('.ob-s')];
    const show = (n) => {
      n = Math.max(0, Math.min(P.length - 1, n)); if (n === cur) return;
      const old = secs[cur]; if (old) { old.classList.remove('on'); old.classList.add('out', n < cur ? 'rev' : 'fwd'); old.setAttribute('aria-hidden', 'true'); setTimeout(() => old.classList.remove('out', 'rev', 'fwd'), 420); }
      const fresh = cur < 0; cur = n;
      setTimeout(() => { secs[n].classList.add('on'); secs[n].removeAttribute('aria-hidden'); }, fresh ? 0 : 260);
      o.querySelectorAll('.ob-dots i').forEach((d, i) => d.classList.toggle('on', i === Math.min(n, 2)));
      o.classList.toggle('last', n === P.length - 1); o.classList.toggle('first', n === 0);
      if (fresh) o.focus({ preventScroll: true }); // the dialog itself, so no ring shows on a button for touch users
    };
    const close = (then) => {
      if (done) return; done = true; try { localStorage.setItem('bija.onb', '1'); } catch {}
      o.classList.add('bye'); document.body.classList.remove('ob-open'); setTimeout(() => o.remove(), 520); if (then) then();
    };
    o.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b || done) return;
      if (b.classList.contains('ob-go')) show(cur + 1);
      else if (b.classList.contains('ob-back')) show(cur - 1);
      else if (b.classList.contains('ob-skip')) show(P.length - 1);
      else if (b.classList.contains('ob-guest')) { close(); }
      else if (b.dataset.p) { const prov = b.dataset.p; close(() => { S.pdView = 'account'; S.pdDirect = true; render(); if (!document.getElementById('stampdrawer')) stampsOpen(document.getElementById('hav')); accSignIn(prov); }); }
    });
    o.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'Escape') { e.preventDefault(); close(); } });
    let sx = null, sy = 0; // swipe between screens
    o.addEventListener('pointerdown', (e) => { if (e.isPrimary && !e.target.closest('a')) { sx = e.clientX; sy = e.clientY; } }, { passive: true });
    o.addEventListener('pointerup', (e) => { if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) show(cur + (dx < 0 ? 1 : -1)); });
    o.addEventListener('pointercancel', () => { sx = null; });
    // the opening (the mark) plays over the first screen; the words start as it lifts
    let mark = false; try { mark = !matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('mo.splash'); } catch {}
    setTimeout(() => show(0), mark ? 1100 : 60);
  }
  onbMaybe();
  addEventListener('DOMContentLoaded', () => { if (window.qrcode && (S.tab === 'card' || S.showScan)) render(); });
  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      // standalone hosting (GitHub Pages): make it installable and work offline
      if (/^https?:$/.test(location.protocol)) {
        document.head.insertAdjacentHTML('beforeend', '<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Bija">');
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      }
      // shared backend (Supabase, London) on the live site; this browser only with ?demo=1, on localhost, or if it can't be reached
      const qs = new URLSearchParams(location.search), local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      if (!qs.has('demo') && (qs.get('backend') === 'supabase' || (!local && location.protocol === 'https:'))) {
        try {
          const load = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
          if (!window.BijaSupabase) { if (!window.supabase) await load('vendor/supabase.js'); await load('bija-supabase.js'); }
          const conn = await window.BijaSupabase.connect();
          S.demo = true; S.backend = 'supabase'; S.sb = conn; S.db = conn.db; S.uid = conn.uid; S.admin = await conn.isStaff(); loadAcct();
          conn.onStaffChange((on) => {
            if (on && !S.admin) { S.admin = true; listenAdmin(S.db); S.db.refreshAll(); lvRefresh(); }
            else if (!on && S.admin) { S.admin = false; S.staffOk = false; S.mh?.el?.destroy(); S.mh = null; if (S.view === 'bar') S.view = 'customer'; }
            render();
          });
          listen(S.db);
          // ledgers: money, points and stamps from the server; refreshed whenever an order or ledger row changes
          if (conn.rpc) { lvRefresh(); conn.onLedgers?.(() => lvRefresh()); }
          return;
        } catch (e) { console.warn('Bija: shared backend unavailable, keeping data in this browser', e); S.offlineBackend = true; }
      }
      S.demo = true; S.db = demoDb(); S.uid = 'you'; S.admin = true; listen(S.db); return; }
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db) { S.noDb = true; render(); return; }
    S.db = db; S.user = user;
    S.uid = user ? await user.id() : null;
    S.admin = user ? await user.canEdit() : false;
    listen(db);
  })();
})();
