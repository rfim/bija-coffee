<style>
/* Bija brand: black page, white Helvetica-style type, four-circle mark (matches bijacoffee.co.uk).
   Layout: one phone-first column (max 760px) that fills the real screen, built the way Stirring Up Joy is:
   sticky pill tabs, a fixed basket bar, checkout on the same page. Barista view widens to 1080px.
   The Bija Card and Secret St James's cards stay black and white; the rest is warm espresso and paper. */
:root {
  --paper: #000000; --card: #121212; --ink: #f2f2f2; --muted: #a3a3a3; --line: rgba(255, 255, 255, .16); --accent: #ffffff; --accent-ink: #000000; --gold: #d9b46a; --leaf: #8fbf7f; --warn: #f0a35a; color-scheme: dark;
  --serif: "Helvetica Neue", Helvetica, Inter, Arial, sans-serif; --sans: "Helvetica Neue", Helvetica, Inter, Arial, sans-serif; --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #000000; --card: #121212; --ink: #f2f2f2; --muted: #a3a3a3; --line: rgba(255, 255, 255, .16); --accent: #ffffff; --accent-ink: #000000; --gold: #d9b46a; --leaf: #8fbf7f; --warn: #f0a35a; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #000000; --card: #121212; --ink: #f2f2f2; --muted: #a3a3a3; --line: rgba(255, 255, 255, .16); --accent: #ffffff; --accent-ink: #000000; --gold: #d9b46a; --leaf: #8fbf7f; --warn: #f0a35a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); }
.wrap.wide { max-width: 1080px; }

.top { display: flex; align-items: center; gap: 12px; padding-block: 6px 10px; flex-wrap: wrap; }
@media (max-width: 440px) { .brand p { display: none; } }
.site-link { font-size: 12px; font-weight: 600; text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }

.switch { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }

.demo { font-size: 12px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 4px 12px; scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 5; }

.tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tabs .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; line-height: 18px; text-align: center; }

.hero { border-radius: 20px; padding: 20px 18px; border: 1px solid var(--line); background: #0b0b0b; color: #fff; position: relative; overflow: hidden; background-size: 56px 56px; }

.sec { margin-top: 20px; }

.filter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-top: 12px; }

.notes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

.menu { display: grid; gap: 8px; }
.prod { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.prod.off { opacity: .55; }

.ic svg { width: 28px; height: 28px; }
.prod h4 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.prod p { margin: 2px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
.price { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.stars { color: var(--gold); font-size: 12px; font-weight: 700; }
.step { display: inline-flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 999px; }
.step button { width: 34px; height: 34px; border: 0; background: transparent; font-size: 19px; font-weight: 700; line-height: 1; border-radius: 50%; }
.step button:disabled { opacity: .3; cursor: default; }
.step output { min-width: 22px; text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
label.f .h { font-weight: 400; color: var(--muted); font-size: 12px; }
input[type=text], input[type=tel], input[type=number], select, textarea { width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); }
textarea { resize: vertical; min-height: 60px; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 500; }
.opts button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); }
.check:has(input:checked) { border-color: var(--leaf); }
.sum { display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.sum div { display: flex; justify-content: space-between; gap: 12px; }
.sum .tot { font-weight: 700; font-size: 18px; border-top: 1.5px dashed var(--line); padding-top: 8px; margin-top: 4px; }
.sum .deal { color: var(--leaf); }
.hint { font-size: 13px; color: var(--muted); }
.hint.warn { color: var(--warn); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.ok { background: var(--leaf); color: var(--card); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

.basket { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--ink); color: var(--paper); }
.basket .in { max-width: 728px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.basket b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.big-code { font-family: var(--mono); font-size: clamp(40px, 14vw, 64px); letter-spacing: .08em; line-height: 1; margin: 10px 0; }
.list { display: grid; gap: 10px; }
.order { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.order .h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.code { font-family: var(--mono); letter-spacing: .04em; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; border: 1.5px solid currentColor; }
.pill.received { color: var(--gold); } .pill.brewing { color: var(--accent); } .pill.ready { color: var(--leaf); } .pill.collected { color: var(--muted); } .pill.cancelled { color: var(--muted); text-decoration: line-through; }
.track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.track span { height: 4px; border-radius: 2px; background: var(--line); }
.track span.on { background: var(--leaf); }
.lines { font-size: 14px; color: var(--muted); }
.lines b { color: var(--ink); font-weight: 600; }
.quote { border-left: 3px solid var(--gold); padding-left: 10px; margin: 0; font-size: 14px; }
.rate { display: inline-flex; gap: 2px; }
.rate button { border: 0; background: transparent; font-size: 24px; line-height: 1; padding: 2px; color: var(--line); }
.rate button.on { color: var(--gold); }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 16px; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.skel { height: 80px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); text-align: center; }

/* Bija Card: black and white Kawung, themeable */
.bcard { border: 1px solid rgba(255,255,255,.18); --c-bg: #0b0b0b; --c-ink: #ffffff; --c-sub: rgba(255,255,255,.7); --c-stamp: #ffffff; --c-stamp-ink: #0b0b0b; --c-empty: rgba(255,255,255,.35);
  position: relative; border-radius: 20px; padding: 18px; color: var(--c-ink); background-color: var(--c-bg); background-size: 56px 56px; overflow: hidden; box-shadow: 0 14px 34px rgba(0, 0, 0, .28); aspect-ratio: 1.586; display: flex; flex-direction: column; container-type: inline-size; }
.bcard .t { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.bcard .name { font-family: var(--c-font, var(--serif)); font-size: clamp(18px, 9cqi, 34px); line-height: 1; }
.bcard .who { font-size: clamp(11px, 3.6cqi, 13px); color: var(--c-sub); margin-top: 4px; }
.bcard .no { font-family: var(--mono); font-size: clamp(8px, 3cqi, 11px); letter-spacing: .12em; text-align: right; color: var(--c-sub); }
.bcard .stamps { margin-top: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 5cqi 4cqi; padding: 0 2cqi; }
.bcard .st { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--c-empty); color: var(--c-empty); font: 600 clamp(8px, 3.2cqi, 12px) var(--mono); }
.bcard .st.on { border: 0; background: var(--c-stamp); color: var(--c-stamp-ink); transform: rotate(-12deg); }
.bcard .st.on svg { width: 62%; height: 62%; }
.bcard .st.gift { border-style: solid; border-color: var(--c-stamp); color: var(--c-stamp); font-size: clamp(7px, 2.6cqi, 10px); }
.bcard .f { display: flex; justify-content: space-between; font-size: clamp(9px, 3.2cqi, 12px); color: var(--c-sub); margin-top: 4cqi; }
@media (prefers-reduced-motion: no-preference) { .bcard .st.on.new { animation: thump .4s ease-out; } @keyframes thump { from { transform: scale(1.5) rotate(-30deg); opacity: 0; } } }
.themes { display: grid; grid-auto-flow: column; grid-auto-columns: 46%; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.themes button { border: 0; background: transparent; padding: 0; text-align: left; display: grid; gap: 6px; font-size: 12px; font-weight: 600; }
.themes button[aria-pressed="true"] .bcard { outline: 3px solid var(--accent); outline-offset: 2px; }
.themes .bcard { box-shadow: none; padding: 10px; border-radius: 12px; }
.passport { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.visa { border-radius: 14px; padding: 12px; border: 1.5px dashed var(--line); min-height: 92px; display: grid; align-content: space-between; }
.visa.got { border-style: solid; background: var(--card); }
.visa b { font-family: var(--serif); font-weight: 400; font-size: 17px; }
.visa small { font-size: 11px; color: var(--muted); }
.visa .seal { justify-self: end; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 700; letter-spacing: .06em; transform: rotate(-14deg); background: var(--ink); color: var(--paper); }

/* Secret St James's: always black and white */
.sc { position: relative; aspect-ratio: 5 / 7; border-radius: 14px; background: #ffffff; color: #0b0b0b; border: 1.5px solid #0b0b0b; padding: 12px; display: flex; flex-direction: column; gap: 6px; container-type: inline-size; box-shadow: 0 8px 20px rgba(0, 0, 0, .16); text-align: left; }
button.sc { cursor: pointer; font: inherit; }

.sc h4 { font-family: var(--serif); font-weight: 400; font-size: clamp(15px, 10.5cqi, 24px); line-height: 1.05; margin: 2px 0 0; text-wrap: balance; }
.sc .sc-story { margin: 0; font-size: clamp(10px, 6.2cqi, 13.5px); line-height: 1.42; color: #3a3a3a; }
.sc .pair { font-size: clamp(9px, 5.4cqi, 12px); color: #5e5e5e; }
.sc .walk { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 6px; font: 500 clamp(9px, 5.4cqi, 11px) var(--mono); border-top: 1px dashed #0b0b0b; padding-top: 8px; }
.sc .mk { width: 22%; aspect-ratio: 1; }
.sc.visited::after { content: "FOUND"; position: absolute; right: 8%; top: 38%; transform: rotate(-14deg); border: 2px solid #0b0b0b; background: #ffffff; padding: 2px 10px; font: 700 clamp(10px, 6cqi, 13px) var(--sans); letter-spacing: .16em; }
.sc.back { background-color: #0b0b0b; color: #ffffff; align-items: center; justify-content: center; text-align: center; background-size: 44px 44px; }
.sc.back b { font-family: var(--serif); font-weight: 400; font-size: clamp(13px, 9cqi, 20px); line-height: 1.1; }
.sc.back small { font-size: clamp(9px, 5.6cqi, 12px); opacity: .7; }
.sc.mini { padding: 9px; border-radius: 12px; box-shadow: none; overflow: hidden; }
.sc.mini h4 { font-size: clamp(12px, 12cqi, 16px); }
.sc.mini .sc-story, .sc.mini .pair { display: none; }
.sc.mini.visited::after { top: auto; bottom: 34%; right: 6%; font-size: 9px; padding: 1px 6px; }
.sc.mini[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.sgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 600px) { .sgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

.cardslot { max-width: 280px; margin: 0 auto; }
.cardslot .sc { aspect-ratio: auto; min-height: 300px; }
@media (prefers-reduced-motion: no-preference) { .sc.deal { animation: deal .5s ease-out; } @keyframes deal { from { transform: rotateY(90deg) translateY(10px); opacity: .3; } } }

/* barista */

.tablewrap { overflow-x: auto; }

    if (!show.length && !cfg().perk) return '';

      <div class="list">${show.map((e) => `<article class="order"><div class="h"><b>${esc(e.title)}</b><span class="pill ${up.length ? 'ready' : 'collected'}">${day(e.date)}${e.end ? '–' + day(e.end) : ''}</span></div><div class="lines">${esc(e.text)}</div></article>`).join('')}

        : `<div class="empty"><b>No card in hand</b>Collect your next order and a new secret card comes with it.</div>`}</section>
      <section class="sec"><div class="sec-h"><h3>Your cards</h3><small>${st.dealt.length} of ${SPOTS.length} dealt</small></div>
        <div class="sgrid">${SPOTS.map((x) => st.dealt.includes(x) ? spotCard(x, { mini: true, act: 'spot', pressed: cur === x, visited: !!st.visited[x.id] }) : spotCard(x, { mini: true, face: false })).join('')}</div>
      </section>`;
  }
  function ordersPage() {
    if (!S.meLoaded) return notReady();
    const os = mine().os;
    if (!os.length) return `<div class="empty"><b>No orders yet</b>Order ahead and watch it go from received to ready here.<br><br><button class="btn sm" data-act="tab" data-v="order">Order now</button></div>`;
    const ratings = S.me?.ratings || {};
    const step = { received: 1, brewing: 2, ready: 3 };
    return `<div class="list">${os.map((o) => {
      const r = ratings[o.id], d = S.rate[o.id] || { stars: 0, comment: '' };
      return `<article class="order">
        <div class="h"><span class="code">${esc(o.code)}</span><span class="pill ${o.status}">${STATUS[o.status]}</span></div>
        <div class="lines">${(o.lines || []).map((l) => `<b>${l.qty}×</b> ${esc(l.name)}`).join(' · ')}</div>
        <div class="hint">${fmt(o.createdAt)} · ${esc(o.slot)} · ${money(o.total)}${o.useReward || o.useSecret ? ' · free drink' : ''}</div>
        ${step[o.status] ? `<div class="track">${[1, 2, 3].map((i) => `<span class="${i <= step[o.status] ? 'on' : ''}"></span>`).join('')}</div>` : ''}
        <div class="row">
          ${o.status === 'received' ? `<button class="btn sm ghost" data-act="cancel" data-id="${esc(o.id)}" ${S.busy ? 'disabled' : ''}>Cancel</button>` : ''}
          ${o.status === 'collected' || o.status === 'cancelled' ? `<button class="btn sm ghost" data-act="reorder" data-id="${esc(o.id)}">Order again</button>` : ''}
        </div>
        ${o.status === 'collected' && r ? `<div class="hint">You rated this <span class="stars">${'★'.repeat(r.stars || 0)}</span>${r.comment ? ` · “${esc(r.comment)}”` : ''}</div>` : ''}
        ${o.status === 'collected' && !r ? `<div class="panel stack" style="background:var(--paper)">
          <div class="row between"><b>How was it?</b><span class="rate" role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="${d.stars === n}" aria-label="${n} star${n > 1 ? 's' : ''}" class="${d.stars >= n ? 'on' : ''}" data-act="star" data-id="${esc(o.id)}" data-n="${n}">★</button>`).join('')}</span></div>
          <label class="f">Anything to tell the bar? <span class="h">Optional</span><input type="text" id="rc-${esc(o.id)}" data-rc="${esc(o.id)}" value="${esc(d.comment)}" maxlength="200"></label>
          <div><button class="btn sm" data-act="rate" data-id="${esc(o.id)}" ${!d.stars || S.busy ? 'disabled' : ''}>Send rating</button></div>
        </div>` : ''}
      </article>`;
    }).join('')}</div>`;
  }

  // ===== barista =====
  function barista() {
    if (!S.custLoaded || !S.configLoaded) return notReady();
    if (S.btab === 'members') return members();
    if (S.btab === 'insights') return insights();
    if (S.btab === 'menu') return menuEditor();
    return queue();
  }
  function allOrders() {
    const out = [];
    for (const c of S.customers) { const b = S.bars[c.id]; for (const o of ordersOf(c, b)) out.push({ ...o, cid: c.id, cname: c.name || 'Guest', st: () => stats(c, b) }); }
    return out.sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));
  }
  function queue() {
    const all = allOrders();
    const active = all.filter((o) => o.status !== 'collected' && o.status !== 'cancelled').reverse();
    const today = new Date().toDateString();
    const todays = all.filter((o) => o.status !== 'cancelled' && new Date(o.createdAt).toDateString() === today);
    const list = S.qFilter === 'active' ? active : S.qFilter === 'collected' ? all.filter((o) => o.status === 'collected') : all;
    const nextLabel = { received: 'Start brewing', brewing: 'Ready · call code', ready: 'Collected · give beans' };
    return `<div class="tiles">
      <div class="tile"><small>In the queue</small><b>${active.length}</b><span>${active.filter((o) => o.status === 'ready').length} ready to collect</span></div>
      <div class="tile"><small>Today</small><b>${money(todays.reduce((a, o) => a + (+o.total || 0), 0))}</b><span>${todays.length} order${todays.length === 1 ? '' : 's'}, after free drinks</span></div>
      <div class="tile"><small>App ordering</small><b>${isOpen() ? 'On' : 'Off'}</b><span><button class="btn sm ghost" data-act="toggle-open" ${S.busy ? 'disabled' : ''}>${isOpen() ? 'Pause orders' : 'Resume orders'}</button></span></div>
    </div>
    <div class="cats" style="margin-top:14px">${[['active', 'Active'], ['collected', 'Collected'], ['all', 'All']].map(([k, l]) => `<button data-act="qf" data-v="${k}" aria-pressed="${S.qFilter === k}">${l}</button>`).join('')}</div>
    <div class="list">${!list.length ? `<div class="empty"><b>${S.qFilter === 'active' ? 'Queue is clear' : 'Nothing here yet'}</b>New app orders appear here the moment they're placed, oldest first.</div>` : list.map((o) => {
      const st = o.st();
      return `<article class="order">
        <div class="h"><span><span class="code" style="font-size:18px">${esc(o.code)}</span> · <b>${esc(o.cname)}</b></span><span class="pill ${o.status}">${STATUS[o.status]}</span></div>
        <div class="lines">${(o.lines || []).map((l) => `<b>${l.qty}×</b> ${esc(l.name)}${l.origin ? ` (${esc(origin(l.origin)?.name || '')})` : ''}`).join(' · ')}</div>
        <div class="hint">${esc(o.milk)} milk · ${esc(o.sweet)} · ${esc(o.slot)} · <b style="color:var(--ink)">${money(o.total)}</b> · ${fmt(o.createdAt)}</div>
        ${o.note ? `<p class="quote">${esc(o.note)}</p>` : ''}
        ${o.useReward ? `<div class="hint warn"><b>Bija Card free drink</b> · ${st.ready ? 'card is full' : 'already used or not earned'} ${st.ready ? `<button class="btn sm ok" data-act="redeem" data-id="${esc(o.cid)}" ${S.busy ? 'disabled' : ''}>Mark used</button>` : ''}</div>` : ''}
        ${o.useSecret ? `<div class="hint warn"><b>Secret St James's free drink</b> · ${st.secretReady ? 'all spots found' : 'already used or not earned'} ${st.secretReady ? `<button class="btn sm ok" data-act="sredeem" data-id="${esc(o.cid)}" ${S.busy ? 'disabled' : ''}>Mark used</button>` : ''}</div>` : ''}
        <div class="row">
          ${FLOW[o.status] ? `<button class="btn sm ${o.status === 'ready' ? 'ok' : ''}" data-act="status" data-c="${esc(o.cid)}" data-o="${esc(o.id)}" data-s="${FLOW[o.status]}" ${S.busy ? 'disabled' : ''}>${nextLabel[o.status]}</button>` : ''}
          ${o.status === 'collected' ? `<button class="btn sm ghost" data-act="status" data-c="${esc(o.cid)}" data-o="${esc(o.id)}" data-s="ready" ${S.busy ? 'disabled' : ''}>Undo</button>` : ''}
        </div>
      </article>`;
    }).join('')}</div>`;
  }
  function members() {
    const rows = S.customers.map((c) => ({ c, st: stats(c, S.bars[c.id]) })).filter((r) => r.st.os.length).sort((a, b) => b.st.beans - a.st.beans);
    if (!rows.length) return `<div class="empty"><b>No Bija Card members yet</b>Everyone who orders in the app gets a card automatically.</div>`;
    return `<div class="panel tablewrap"><table>
      <thead><tr><th>Name</th><th class="num">Beans</th><th class="num">On card</th><th class="num">Free used</th><th class="num">Secrets</th><th>Last order</th></tr></thead>
      <tbody>${rows.map(({ c, st }) => `<tr><td><b>${esc(c.name || 'Guest')}</b>${st.ready ? ' <span class="pill ready">Free drink</span>' : ''}${st.secretReady ? ' <span class="pill brewing">Secret drink</span>' : ''}</td><td class="num">${st.beans}</td><td class="num">${st.onCard}/${NEED - 1}</td><td class="num">${st.redeemed}${st.secretUsed ? ' +1' : ''}</td><td class="num">${st.found}/${SPOTS.length}</td><td>${fmt(st.os[0]?.createdAt)}</td></tr>`).join('')}</tbody>
    </table></div>`;
  }
  function bars(entries, fmtv) {
    if (!entries.length) return `<p class="hint">No data yet.</p>`;
    const max = Math.max(...entries.map((e) => e[1]), 1);
    return `<div class="bars">${entries.map(([n, v]) => `<div class="bar"><span class="n" title="${esc(n)}">${esc(n)}</span><span class="tr"><span class="fl" style="width:${(v / max) * 100}%"></span></span><span class="v">${fmtv ? fmtv(v) : v}</span></div>`).join('')}</div>`;
  }
  function insights() {
    const all = allOrders().filter((o) => o.status !== 'cancelled');
    const buyers = S.customers.filter((c) => ordersOf(c, S.bars[c.id]).some((o) => o.status !== 'cancelled'));
    const repeat = buyers.filter((c) => ordersOf(c, S.bars[c.id]).filter((o) => o.status !== 'cancelled').length >= 2).length;
    const qty = new Map(); for (const o of all) for (const l of o.lines || []) qty.set(l.name, (qty.get(l.name) || 0) + l.qty);
    const hours = new Map(); for (const o of all) { const h = new Date(o.createdAt).getHours(); const k = String(h).padStart(2, '0') + ':00'; hours.set(k, (hours.get(k) || 0) + 1); }
    const spots = SPOTS.map((x) => [x.name, S.customers.filter((c) => c.secret?.visited?.[x.id]).length]);
    const ratings = S.customers.flatMap((c) => Object.values(c.ratings || {}).map((r) => ({ ...r, name: c.name })));
    const avg = ratings.length ? ratings.reduce((a, r) => a + (+r.stars || 0), 0) / ratings.length : 0;
    const comments = ratings.filter((r) => r.comment).sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 6);
    return `<div class="tiles">
      <div class="tile"><small>App customers</small><b>${buyers.length}</b><span>${repeat} came back</span></div>
      <div class="tile"><small>Revenue</small><b>${money(all.reduce((a, o) => a + (+o.total || 0), 0))}</b><span>${all.length} order${all.length === 1 ? '' : 's'}, all time</span></div>
      <div class="tile"><small>Rating</small><b>${ratings.length ? avg.toFixed(1) : '–'}</b><span>${ratings.length} rating${ratings.length === 1 ? '' : 's'}</span></div>
    </div>
    <div class="cols sec">
      <div class="panel"><div class="sec-h"><h3>Best sellers</h3></div>${bars([...qty].sort((a, b) => b[1] - a[1]).slice(0, 8))}</div>
      <div class="panel"><div class="sec-h"><h3>Order times</h3></div>${bars([...hours].sort((a, b) => a[0].localeCompare(b[0])))}</div>
      <div class="panel"><div class="sec-h"><h3>Secret spots found</h3></div>${bars(spots.filter((s) => s[1]))}</div>
      <div class="panel"><div class="sec-h"><h3>What people say</h3></div>${comments.length ? `<div class="list">${comments.map((r) => `<p class="quote">${esc(r.comment)}<br><span class="hint">${esc(r.name || 'Guest')} · ${'★'.repeat(r.stars || 0)}</span></p>`).join('')}</div>` : '<p class="hint">No comments yet.</p>'}</div>
    </div>`;
  }
  function menuEditor() {
    const d = S.draft || (S.draft = JSON.parse(JSON.stringify(S.config || STARTER)));
    return `${!S.config ? `<div class="panel" style="margin-bottom:12px"><b>No menu is live yet.</b> <span class="hint">This is the starter menu. Edit it and publish to open the app.</span></div>` : ''}
    <div class="panel stack">
      <div class="grid2">
        <label class="f">On filter today<select id="m-filter" data-d="filter">${ORIGINS.map((o) => `<option value="${o.id}" ${d.filter === o.id ? 'selected' : ''}>${esc(o.name)}, ${esc(o.where)}</option>`).join('')}</select></label>
        <label class="f">Opening line <span class="h">Shown on the order screen</span><input type="text" id="m-note" data-d="note" value="${esc(d.note || '')}" maxlength="120"></label>
      </div>
      <label class="check"><input type="checkbox" id="m-open" data-d="open" ${d.open ? 'checked' : ''}><span><b>Take app orders</b><br><span class="hint">Untick to pause ordering, for example when the bar is slammed.</span></span></label>
      <div>${(d.menu || []).map((m, i) => `<div class="edit-item">
        <label class="f"><span class="sr">Name</span><input type="text" id="mi-n-${i}" data-m="${i}" data-k="name" value="${esc(m.name)}"></label>
        <label class="f"><span class="sr">Price</span><input type="number" step="0.1" min="0" id="mi-p-${i}" data-m="${i}" data-k="price" value="${esc(m.price)}"></label>
        <label class="check" style="padding:6px 10px"><input type="checkbox" id="mi-a-${i}" data-m="${i}" data-k="available" ${m.available ? 'checked' : ''}><span>${esc(m.cat)} · on</span></label>
      </div>`).join('')}</div>
      <div class="row between"><button class="btn sm ghost" data-act="reset-draft">Discard changes</button><button class="btn" data-act="save-cfg" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Saving…' : S.config ? 'Save menu' : 'Publish menu'}</button></div>
    </div>`;
  }

  // ---------- actions ----------
  async function run(fn, okMsg) {
    if (S.busy) return;
    S.busy = true; render();
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) {
      const c = e && e.code;
      toast(c === 'invalid_argument' ? 'You don’t have permission to save this.' : c === 'quota_exceeded' ? 'Storage is full. Ask the owner to clear old data.' : 'Couldn’t save. Check your connection and try again.');
    } finally { S.busy = false; render(); }
  }
  function newCode() { const a = 'ACDEFGHJKMNPQRTUVWXY34679'; let s = ''; for (let i = 0; i < 3; i++) s += a[Math.floor(Math.random() * a.length)]; return 'B' + s; }
  const myRef = () => S.db.doc('customers/' + S.uid);
  async function saveMine(patch) { if (S.me) await myRef().update(patch); else await myRef().set({ name: S.form.name.trim(), joinedAt: new Date().toISOString(), orders: {}, ratings: {}, secret: { visited: {} }, ...patch }); }
  async function saveBar(cid, patch) { const ref = S.db.doc('bar/' + cid); if (S.bars[cid]) await ref.update(patch); else await ref.set({ orders: {}, redeemed: 0, secretUsed: false, ...patch }); }

  async function placeOrder() {
    const lines = cartLines(), t = totals(lines), f = S.form, st = mine();
    if (!t.qty) return toast('Add at least one drink.');
    if (!f.name.trim()) { toast('Add a name so we can call your cup.'); return document.getElementById('f-name')?.focus(); }
    const oid = 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const order = { code: newCode(), lines, subtotal: t.subtotal, free: t.free, total: t.total, milk: f.milk, sweet: f.sweet, slot: f.slot, note: f.note.trim(),
      useReward: !!(f.reward && st.ready), useSecret: !!(f.sreward && st.secretReady), name: f.name.trim(), createdAt: new Date().toISOString() };
    await run(async () => {
      await saveMine({ name: f.name.trim(), updatedAt: new Date().toISOString(), orders: { [oid]: order } });
      S.lastOrder = oid; S.cart = {}; S.form.note = ''; S.form.reward = false; S.form.sreward = false;
      window.scrollTo({ top: 0 });
    }, 'Order sent to the bar');
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'view') { S.view = b.dataset.v; render(); window.scrollTo({ top: 0 }); }
    else if (a === 'tab') { if (S.view === 'bar') S.btab = b.dataset.v; else { S.tab = b.dataset.v; S.lastOrder = null; S.fresh = -1; S.dealt = null; } render(); window.scrollTo({ top: 0 }); }
    else if (a === 'cat') { S.cat = b.dataset.v; render(); }
    else if (a === 'qty') { const id = b.dataset.id; S.cart[id] = Math.max(0, Math.min(20, (S.cart[id] || 0) + +b.dataset.d)); render(); }
    else if (a === 'opt') { S.form[b.dataset.k] = b.dataset.v; render(); }
    else if (a === 'goto-checkout') { if (S.tab !== 'order') { S.tab = 'order'; render(); } document.getElementById('checkout')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
    else if (a === 'place') placeOrder();
    else if (a === 'again') { S.lastOrder = null; render(); window.scrollTo({ top: 0 }); }
    else if (a === 'theme') { S.theme = b.dataset.v; store.set('bija.theme', S.theme); render(); }
    else if (a === 'spot') { S.spot = b.dataset.id; S.dealt = null; render(); }
    else if (a === 'checkin') { const id = b.dataset.id; run(() => saveMine({ secret: { visited: { [id]: new Date().toISOString() } } }), 'Found! A bean lands on the map'); }
    else if (a === 'cancel') run(() => myRef().update({ orders: { [b.dataset.id]: { cancelled: true } } }), 'Order cancelled');
    else if (a === 'reorder') {
      const o = mine().os.find((x) => x.id === b.dataset.id); if (!o) return;
      for (const l of o.lines || []) if (menu().some((m) => m.id === l.id && m.available)) S.cart[l.id] = (S.cart[l.id] || 0) + l.qty;
      S.tab = 'order'; render(); document.getElementById('checkout')?.scrollIntoView();
    }
    else if (a === 'star') { (S.rate[b.dataset.id] ||= { stars: 0, comment: '' }).stars = +b.dataset.n; render(); }
    else if (a === 'rate') {
      const id = b.dataset.id, d = S.rate[id]; if (!d?.stars) return;
      const o = mine().os.find((x) => x.id === id);
      run(async () => { await myRef().update({ ratings: { [id]: { stars: d.stars, comment: (d.comment || '').trim(), drink: o?.lines?.find(isDrink)?.id || '', at: new Date().toISOString() } } }); delete S.rate[id]; }, 'Terima kasih!');
    }
    // barista
    else if (a === 'qf') { S.qFilter = b.dataset.v; render(); }
    else if (a === 'status') { const s = b.dataset.s; run(() => saveBar(b.dataset.c, { orders: { [b.dataset.o]: { status: s, at: new Date().toISOString() } } }), s === 'collected' ? 'Collected. Beans and a secret card added.' : s === 'ready' ? 'Marked ready' : 'Updated'); }
    else if (a === 'redeem') { const cid = b.dataset.id; run(() => saveBar(cid, { redeemed: (+S.bars[cid]?.redeemed || 0) + 1 }), 'Free drink marked as used'); }
    else if (a === 'sredeem') run(() => saveBar(b.dataset.id, { secretUsed: true }), 'Secret St James\'s drink marked as used');
    else if (a === 'toggle-open') run(() => S.db.doc('config/current').update({ open: !isOpen() }), isOpen() ? 'App ordering paused' : 'App ordering resumed');
    else if (a === 'reset-draft') { S.draft = null; render(); }
    else if (a === 'save-cfg') {
      const d = S.draft;
      const next = { ...d, open: !!d.open, note: (d.note || '').trim(), menu: d.menu.filter((m) => m.name.trim()).map((m) => ({ ...m, name: m.name.trim(), price: Math.max(0, +m.price || 0), available: !!m.available })) };
      if (!next.menu.length) return toast('Add at least one item.');
      run(async () => { await S.db.doc('config/current').set(next); S.draft = null; }, S.config ? 'Menu saved' : 'Menu is live');
    }
  });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('g.pin[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
  document.addEventListener('input', (e) => {
    const el = e.target, val = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.f) { S.form[el.dataset.f] = val; if (el.dataset.f === 'name') store.set('bija.name', val); if (el.type === 'checkbox') render(); }
    else if (el.dataset.rc) (S.rate[el.dataset.rc] ||= { stars: 0, comment: '' }).comment = val;
    else if (el.dataset.d && S.draft) S.draft[el.dataset.d] = val;
    else if (el.dataset.m && S.draft) S.draft.menu[+el.dataset.m][el.dataset.k] = val;
  });

  // ---------- local demo store: same calls as the db capability, kept in this browser ----------
  function demoDb() {
    const KEY = 'bija.app.demo';
    let data = {}; try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
    const subs = new Set(), clone = (v) => v === undefined ? v : JSON.parse(JSON.stringify(v));
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} setTimeout(() => subs.forEach((f) => f()), 0); };
    const merge = (t, p) => { for (const [k, v] of Object.entries(p)) { if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) merge(t[k], v); else t[k] = clone(v); } };
    const snap = (p) => ({ id: p.split('/').pop(), exists: p in data, data: () => clone(data[p]) });
    if (!data['config/current']) data['config/current'] = clone(STARTER);
    return {
      doc: (p) => ({
        get: async () => snap(p),
        set: async (v) => { data[p] = clone(v); save(); },
        update: async (v) => { if (!(p in data)) throw { code: 'not_found' }; merge(data[p], v); save(); },
        onSnapshot: (cb) => { const f = () => cb(snap(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
      }),
      collection: (p) => ({
        onSnapshot: (cb) => {
          const depth = p.split('/').length + 1;
          const f = () => cb({ docs: Object.keys(data).filter((k) => k.startsWith(p + '/') && k.split('/').length === depth).map(snap) });
          subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
        },
      }),
    };
  }

  // ---------- boot ----------
  try { const v = new URLSearchParams(location.search).get('view'); if (v === 'app' || v === 'site') localStorage.setItem('bija.view', v); } catch {}
  if (location.hash === '#beans') S.tab = 'beans';
  S.form.name = store.get('bija.name') || '';
  S.theme = store.get('bija.theme') || 'noir';
  render();
  function listen(db) {
    db.doc('config/current').onSnapshot((s) => { S.config = s.exists ? s.data() : null; S.configLoaded = true; if (S.config && !(S.config.slots || []).includes(S.form.slot)) S.form.slot = (S.config.slots || ['ASAP'])[0]; render(); }, () => { S.configLoaded = true; render(); });
    if (S.uid) {
      db.doc('customers/' + S.uid).onSnapshot((s) => {
        S.me = s.exists ? s.data() : null; S.meLoaded = true;
        if (S.me && !S.form.name) S.form.name = S.me.name || '';
        render();
      }, () => { S.meLoaded = true; render(); });
      db.doc('bar/' + S.uid).onSnapshot((s) => {
        const before = stats(S.me, S.bar);
        S.bar = s.exists ? s.data() : null;
        const after = stats(S.me, S.bar);
        if (S.barLoaded && S.meLoaded && after.col.length > before.col.length) {
          const dealt = after.dealt.length > before.dealt.length ? after.dealt[after.dealt.length - 1] : null;
          S.fresh = Math.max(0, after.onCard - 1);
          if (dealt) { S.dealt = dealt.id; S.spot = dealt.id; }
          toast(`+${after.beans - before.beans} bean${after.beans - before.beans === 1 ? '' : 's'}${dealt ? ' and a new secret card' : ''}`);
        }
        S.barLoaded = true; render();
      }, () => { S.barLoaded = true; render(); });
    } else S.meLoaded = true;
    if (S.admin) {
      db.collection('customers').onSnapshot((q) => { S.customers = q.docs.map((d) => ({ id: d.id, ...d.data() })); S.custLoaded = true; render(); }, () => { S.custLoaded = true; render(); });
      db.collection('bar').onSnapshot((q) => { S.bars = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); render(); }, () => render());
    }
    render();
  }
  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { S.demo = true; S.db = demoDb(); S.uid = 'you'; S.admin = true; listen(S.db); return; }
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db) { S.noDb = true; render(); return; }
    S.db = db; S.user = user;
    S.uid = user ? await user.id() : null;
    S.admin = user ? await user.canEdit() : false;
    listen(db);
  })();
})();
</script>
</body></html>
