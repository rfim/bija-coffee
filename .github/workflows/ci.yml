name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.63.0
  AXE_CORE_VERSION: 4.10.2
  PORT: 8099
  BASE_URL: http://localhost:8099/
  TEST_OUTPUT_DIR: ${{ github.workspace }}/test-results

# Explicit bash turns on pipefail, so `node ... | tee` still fails the step.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The site has no package.json; tool dependencies go outside the repo and are found via NODE_PATH.
      - name: Install Playwright ${{ env.PLAYWRIGHT_VERSION }}, Chromium and axe-core ${{ env.AXE_CORE_VERSION }}
        run: |
          DEPS="$RUNNER_TEMP/deps"
          npm install --prefix "$DEPS" --no-save --no-package-lock --no-audit --no-fund \
            "playwright@${PLAYWRIGHT_VERSION}" "axe-core@${AXE_CORE_VERSION}"
          "$DEPS/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$DEPS/node_modules" >> "$GITHUB_ENV"
          echo "$DEPS/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Serve the repo root on port ${{ env.PORT }}
        run: |
          mkdir -p "$TEST_OUTPUT_DIR/logs"
          nohup python3 -m http.server "$PORT" --bind 127.0.0.1 > "$TEST_OUTPUT_DIR/logs/http-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$BASE_URL" && exit 0
            sleep 1
          done
          echo "::error::http.server did not start"; exit 1

      # Every tests/*.js except the two audits below, which get their own steps.
      # Runs them all, then fails if any failed. An empty or missing tests/ folder passes.
      - name: Node tests (tests/*.js)
        run: |
          shopt -s nullglob
          failed=()
          ran=0
          for f in tests/*.js; do
            case "$(basename "$f")" in a11y.js|links.js) continue ;; esac
            ran=$((ran + 1))
            echo "::group::$f"
            if ! node "$f" 2>&1 | tee "$TEST_OUTPUT_DIR/logs/$(basename "$f" .js).log"; then failed+=("$f"); fi
            echo "::endgroup::"
          done
          echo "Ran $ran test file(s)."
          if [ ${#failed[@]} -gt 0 ]; then
            for f in "${failed[@]}"; do echo "::error file=$f::$f failed"; done
            exit 1
          fi

      - name: Accessibility audit (axe-core, WCAG 2.2 AA)
        if: ${{ !cancelled() }}
        run: node tests/a11y.js 2>&1 | tee "$TEST_OUTPUT_DIR/logs/a11y.log"

      - name: Internal links and assets
        if: ${{ !cancelled() }}
        run: node tests/links.js 2>&1 | tee "$TEST_OUTPUT_DIR/logs/links.log"

      - name: Upload screenshots and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
