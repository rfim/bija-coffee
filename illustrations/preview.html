<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Bija illustrations</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #0b0b0b; font: 14px/1.5 Inter, system-ui, sans-serif; padding: 40px 24px; }
  h1 { font: 900 40px/1 Archivo, 'Arial Black', sans-serif; text-transform: uppercase; margin: 0 0 8px; }
  p { color: #6b6b6b; margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  figure { margin: 0; background: #f2f2f0; border-radius: 16px; padding: 16px; }
  figure img { display: block; width: 100%; aspect-ratio: 1; }
  figcaption { font: 600 12px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
  .dark figure { background: #0b0b0b; color: #fff; }
  .dark { margin-top: 40px; }
  .dark figure svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<h1>Bija illustrations</h1>
<p>Black-and-white line art for menu items without a photo. Each file uses currentColor, so it follows the text colour.</p>
<div class="grid" id="light"></div>
<div class="grid dark" id="dark"></div>
<script>
fetch('index.json').then((r) => r.json()).then(async (idx) => {
  const light = document.getElementById('light'), dark = document.getElementById('dark');
  for (const [id, x] of Object.entries(idx)) {
    const src = x.file.replace('illustrations/', '');
    const a = document.createElement('figure'); const img = document.createElement('img'); img.src = src; img.alt = x.alt; img.width = 240; img.height = 240;
    const c = document.createElement('figcaption'); c.textContent = id; a.append(img, c); light.append(a);
    const b = document.createElement('figure'); b.innerHTML = await (await fetch(src)).text(); const c2 = c.cloneNode(true); b.append(c2); dark.append(b);
  }
});
</script>
</body>
</html>
